<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13">
<title>A tool call's journey through within-sdk, with the findings marked</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
<rect width="980" height="470" fill="#fbfaf6"/>
<rect x="14" y="88" width="140" height="70" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="24" y="120.0" fill="#1f2328" font-weight="600">Customer's AI</text><text x="24" y="138.0" fill="#59636e">assistant</text>
<rect x="196" y="88" width="150" height="70" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="206" y="120.0" fill="#1f2328" font-weight="600">Vendor's MCP server</text><text x="206" y="138.0" fill="#59636e">the vendor's own tool</text>
<line x1="154" y1="123" x2="196" y2="123" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="384" y="16" width="440" height="440" rx="14" fill="#eef4fb" stroke="#2563eb" stroke-width="2" stroke-dasharray="7 5"/>
<text x="400" y="38" fill="#2563eb" font-weight="700" font-size="14">within-sdk, loaded inside the vendor's server</text>
<rect x="400" y="50" width="408" height="54" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="410" y="74.0" fill="#1f2328" font-weight="600">1  Tool list</text><text x="410" y="92.0" fill="#59636e">adds a required context input and a get_more_tools tool</text>
<rect x="752" y="56" width="46" height="19" rx="9.5" fill="#2563eb"/><text x="775" y="69.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-10</text>
<rect x="400" y="116" width="408" height="54" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="410" y="140.0" fill="#1f2328" font-weight="600">2  Reporter</text><text x="410" y="158.0" fill="#59636e">copies every tool call, arguments and result, into an event</text>
<rect x="702" y="122" width="46" height="19" rx="9.5" fill="#d97706"/><text x="725" y="135.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-03</text>
<rect x="752" y="122" width="46" height="19" rx="9.5" fill="#d97706"/><text x="775" y="135.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-08</text>
<line x1="604" y1="108" x2="604" y2="116" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="400" y="182" width="408" height="54" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="410" y="206.0" fill="#1f2328" font-weight="600">3  Vendor's redaction function</text><text x="410" y="224.0" fill="#59636e">is handed every string, even the API key and the address</text>
<rect x="752" y="188" width="46" height="19" rx="9.5" fill="#d97706"/><text x="775" y="201.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-07</text>
<line x1="604" y1="174" x2="604" y2="182" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="400" y="248" width="408" height="54" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="410" y="272.0" fill="#1f2328" font-weight="600">4  Privacy filter</text><text x="410" y="290.0" fill="#59636e">name list, whole-value patterns, email pattern on the whole text</text>
<rect x="652" y="254" width="46" height="19" rx="9.5" fill="#d1242f"/><text x="675" y="267.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-02</text>
<rect x="702" y="254" width="46" height="19" rx="9.5" fill="#d97706"/><text x="725" y="267.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-04</text>
<rect x="752" y="254" width="46" height="19" rx="9.5" fill="#d1242f"/><text x="775" y="267.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-01</text>
<line x1="604" y1="240" x2="604" y2="248" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="400" y="314" width="408" height="54" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="410" y="338.0" fill="#1f2328" font-weight="600">5  Queue</text><text x="410" y="356.0" fill="#59636e">5 requests at a time, no time limit on a request</text>
<rect x="752" y="320" width="46" height="19" rx="9.5" fill="#d97706"/><text x="775" y="333.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-05</text>
<line x1="604" y1="306" x2="604" y2="314" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="400" y="382" width="196" height="48" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="410" y="403.0" fill="#1f2328" font-weight="600">Log file</text><text x="410" y="421.0" fill="#59636e">~/within-sdk.log, only grows</text>
<rect x="404" y="434" width="46" height="19" rx="9.5" fill="#2563eb"/><text x="427" y="447.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-09</text>
<rect x="612" y="382" width="196" height="48" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="622" y="403.0" fill="#1f2328" font-weight="600">Shutdown handler</text><text x="622" y="421.0" fill="#59636e">swallows the first SIGTERM</text>
<rect x="616" y="434" width="46" height="19" rx="9.5" fill="#d97706"/><text x="639" y="447.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-06</text>
<line x1="346" y1="123" x2="384" y2="123" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="846" y="88" width="120" height="70" rx="9" fill="#fff" stroke="#8b949e" stroke-width="1.5"/>
<text x="856" y="120.0" fill="#1f2328" font-weight="600">Within's</text><text x="856" y="138.0" fill="#59636e">service</text>
<path d="M808 311 L828 311 L828 123 L846 123" fill="none" stroke="#59636e" stroke-width="1.8" marker-end="url(#a)"/>
<text x="834" y="215" fill="#59636e" font-size="11" transform="rotate(-90 834 215)">reports</text>
<rect x="846" y="200" width="120" height="92" rx="9" fill="#fff8ee" stroke="#d97706" stroke-width="1.5"/>
<text x="856" y="224" fill="#1f2328" font-weight="600">Docs install line</text><text x="856" y="242" fill="#59636e">names a package</text><text x="856" y="258" fill="#59636e">that npm does</text><text x="856" y="274" fill="#59636e">not have</text>
<rect x="856" y="296" width="46" height="19" rx="9.5" fill="#d97706"/><text x="879" y="309.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">W-11</text>
<text x="14" y="215" fill="#59636e" font-size="12">Colour = severity:</text>
<rect x="14" y="224" width="46" height="19" rx="9.5" fill="#d1242f"/><text x="37" y="237.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">High</text>
<rect x="66" y="224" width="58" height="19" rx="9.5" fill="#d97706"/><text x="95" y="237.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Medium</text>
<rect x="130" y="224" width="40" height="19" rx="9.5" fill="#2563eb"/><text x="150" y="237.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Low</text>
<text x="14" y="270" fill="#59636e" font-size="12">The vendor's tool still</text><text x="14" y="286" fill="#59636e" font-size="12">answers at once while 1</text><text x="14" y="302" fill="#59636e" font-size="12">freezes the process: the</text><text x="14" y="318" fill="#59636e" font-size="12">freeze comes after, when</text><text x="14" y="334" fill="#59636e" font-size="12">the event is cleaned.</text>
</svg>