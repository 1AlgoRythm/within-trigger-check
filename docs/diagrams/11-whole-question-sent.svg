<text x="54" y="284" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">arrived as typed</tspan></text>
<path d="M264.3 239.6 Q367.7 239.7 470.1 239.3 Q473.1 283.6 472.2 328.7 Q369.6 327.5 265.4 327.1 Q267.1 282.3 264.3 239.6" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="278" y="262" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="278" dy="0">phone</tspan></text>
<text x="278" y="284" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="278" dy="0">arrived as typed</tspan></text>
<path d="M488.5 237.9 Q590.3 239.3 696.5 236.9 Q696.5 282.4 697.4 327.4 Q589.5 327.4 486.2 326.1 Q486.9 281.8 488.5 237.9" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="502" y="262" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="502" dy="0">email</tspan></text>
<text x="502" y="284" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="502" dy="0">arrived as typed</tspan></text>
<path d="M711.9 239.9 Q816.9 239.2 920.6 239.0 Q918.7 282.3 920.5 329.7 Q814.8 328.9 711.4 328.2 Q711.5 285.3 711.9 239.9" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="726" y="262" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="726" dy="0">card</tspan></text>
<text x="726" y="284" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="726" dy="0">arrived as typed</tspan></text>
<text x="40" y="362" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">Check C10. The question is sent so a rep can answer it; the docs do not say it is sent unredacted.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">The customer's whole question goes to Within</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-11 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">When the customer asks Within a question, the full text is sent. The filter that hides emails elsewhere does not run.</tspan></text>
<g filter="url(#wob)">
<path d="M38.1 447.7 Q253.9 448.1 469.8 444.7 Q471.3 487.0 468.1 533.4 Q253.0 532.0 40.1 534.8 Q36.8 492.9 38.1 447.7" fill="#f6f6f4" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Where in the code</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="54" dy="0">dist/index.js lines 4303 to 4308: question is added to the</tspan><tspan x="54" dy="15.84">body sent to /v1/answers.</tspan></text>
<path d="M488.1 445.8 Q704.2 447.6 918.7 445.3 Q917.9 492.4 918.6 534.6 Q704.1 536.4 489.7 534.9 Q489.1 491.9 488.1 445.8" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="504" dy="0">Add it to the docs table.</tspan></text>
</g>
</svg>