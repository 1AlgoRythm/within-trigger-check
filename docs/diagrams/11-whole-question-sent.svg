<text x="56" y="136" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="13.5" fill="#1f2328"><tspan x="56" dy="0">&quot;Hi, I'm Priya Raman (priya.raman@acme-fund.com, +1 617 555 0142). What does Team cost for 40 seats?…&quot;</tspan></text>
<text x="56" y="160" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="56" dy="0">fields in the request to Within: customerSessionId, topic, question</tspan></text>
<path d="M480 182 Q476.0 203.0 480 232" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" class="flow"/>
