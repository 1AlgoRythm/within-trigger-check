<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Without a goal text 0 reports left; with a goal text 1 did">
<title>Without a goal text 0 reports left; with a goal text 1 did</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M38.0 118.2 Q231.5 121.9 421.3 121.1 Q423.3 168.6 421.8 218.7 Q229.3 216.7 39.2 218.6 Q37.7 168.4 38.0 118.2" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">An unwrapped tool: internal_admin_lookup</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">the vendor did not wrap it, as the docs allow</tspan></text>
<text x="54" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">the model's goal: HR wants Priya Raman's salary</tspan></text>
<path d="M150 222 Q153.1 251.4 150 280" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M145.4 268.9 L150 280 L156.9 270.2" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M310 222 Q358.0 253.1 400 280" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M388.0 279.2 L400 280 L394.2 269.5" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M41.7 285.5 Q168.0 286.2 291.3 285.9 Q292.2 330.4 291.8 373.2 Q164.7 374.8 39.4 372.9 Q42.2 329.9 41.7 285.5" fill="#f3faf6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="308" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">No goal text</tspan></text>
<text x="54" y="330" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">0 reports to Within</tspan></text>
<path d="M328.5 284.0 Q467.9 284.4 610.1 284.6 Q608.6 326.5 608.2 373.2 Q470.2 374.5 328.2 375.9 Q326.2 332.3 328.5 284.0" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="344" y="308" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="344" dy="0">A model-written goal text</tspan></text>
<text x="344" y="330" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="344" dy="0">1 report to Within</tspan></text>
<path d="M649.0 121.3 Q786.3 119.8 921.1 121.7 Q918.1 245.5 919.5 372.2 Q781.6 371.5 648.4 372.0 Q650.8 245.0 649.0 121.3" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="664" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="700"><tspan x="664" dy="0">What can go with it</tspan></text>
<text x="664" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="664" dy="0">argument preview:</tspan></text>
<text x="664" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="664" dy="0">&quot;salary of Priya Raman (617) 5…&quot;</tspan></text>
<text x="664" y="204" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="664" dy="0">(with argument capture on)</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">A tool the vendor did not wrap still reports</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-09 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The docs say to wrap the tools Within should see. The SDK hooks every tool and reports one when a goal is filled in.</tspan></text>
<g filter="url(#wob)">
<path d="M41.4 445.6 Q253.9 448.2 468.5 447.3 Q469.5 492.1 468.1 534.1 Q253.8 536.0 39.9 533.4 Q41.5 489.6 41.4 445.6" fill="#f6f6f4" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Where in the code</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="54" dy="0">patchRegisterTool, dist/index.js lines 1415 to 1480: it</tspan><tspan x="54" dy="15.84">reports any tool that is not flagged as already reporting,</tspan><tspan x="54" dy="15.84">as soon as the goal text is present.</tspan></text>
<path d="M491.0 446.9 Q704.1 446.0 919.5 447.0 Q919.7 487.9 918.3 532.8 Q705.7 536.7 490.9 535.8 Q489.5 491.7 491.0 446.9" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="504" dy="0">Report only wrapped tools, or make reporting of other tools</tspan><tspan x="504" dy="15.84">an explicit opt-in option, and document it.</tspan></text>
</g>
</svg>