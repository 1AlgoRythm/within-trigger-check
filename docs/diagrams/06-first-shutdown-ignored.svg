<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Plain Node exits after 1 ms, a server with the package was still running after 12 seconds, and a second signal ended it after 3,007 ms">
<title>Plain Node exits after 1 ms, a server with the package was still running after 12 seconds, and a second signal ended it after 3,007 ms</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M200 130 Q557.6 133.2 920 130" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round"/>
<path d="M909.5 135.8 L920 130 L909.4 124.3" fill="none" stroke="#59636e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="200" y="120" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="200" dy="0">seconds after SIGTERM</tspan></text>
<path d="M200 126 Q201.1 131.3 200 136" fill="none" stroke="#59636e" stroke-width="1.4" stroke-linecap="round"/>
<text x="200" y="152" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e" text-anchor="middle"><tspan x="200" dy="0">0</tspan></text>
<path d="M380 126 Q376.9 127.7 380 136" fill="none" stroke="#59636e" stroke-width="1.4" stroke-linecap="round"/>
<text x="380" y="152" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e" text-anchor="middle"><tspan x="380" dy="0">3</tspan></text>
<path d="M560 126 Q558.4 132.1 560 136" fill="none" stroke="#59636e" stroke-width="1.4" stroke-linecap="round"/>
<text x="560" y="152" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e" text-anchor="middle"><tspan x="560" dy="0">6</tspan></text>
<path d="M740 126 Q736.2 134.9 740 136" fill="none" stroke="#59636e" stroke-width="1.4" stroke-linecap="round"/>
<text x="740" y="152" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e" text-anchor="middle"><tspan x="740" dy="0">9</tspan></text>
<path d="M920 126 Q920.7 131.4 920 136" fill="none" stroke="#59636e" stroke-width="1.4" stroke-linecap="round"/>
<text x="920" y="152" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e" text-anchor="middle"><tspan x="920" dy="0">12</tspan></text>
<text x="40" y="194" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="600"><tspan x="40" dy="0">Plain Node</tspan></text>
<path d="M199.7 172.4 Q204.2 170.9 208.1 170.6 Q205.9 186.8 208.2 207.1 Q206.4 205.8 201.8 206.4 Q199.7 189.5 199.7 172.4" fill="#10b98133" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="growx"/>
<text x="218" y="195" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#10b981" font-weight="700"><tspan x="218" dy="0">exits after 1 ms</tspan></text>
<text x="40" y="254" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="600"><tspan x="40" dy="0">With the package</tspan></text>
<path d="M201.4 233.5 Q557.9 233.8 912.3 233.3 Q914.2 249.0 911.2 265.6 Q554.8 265.8 201.5 266.6 Q201.9 249.7 201.4 233.5" fill="#ef444433" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="growx"/>
<text x="212" y="255" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#ef4444" font-weight="700"><tspan x="212" dy="0">still running after 12 seconds, force-killed</tspan></text>
<text x="40" y="314" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="600"><tspan x="40" dy="0">A second signal</tspan></text>
<path d="M200.0 292.2 Q290.4 291.4 380.3 291.6 Q380.0 311.3 381.7 328.0 Q289.4 327.4 202.0 327.5 Q199.4 311.7 200.0 292.2" fill="#f9731633" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="growx"/>
<text x="390.41999999999996" y="315" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#f97316" font-weight="700"><tspan x="390.41999999999996" dy="0">sent at 3 seconds: ends after 3,007 ms</tspan></text>
<path d="M41.1 350.8 Q482.1 348.6 920.9 350.8 Q921.7 387.5 920.7 427.5 Q482.0 425.0 38.7 427.1 Q39.0 387.7 41.1 350.8" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="378" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328"><tspan x="56" dy="0">The package's own handler catches the first SIGTERM, waits for its queue to empty,</tspan></text>
<text x="56" y="400" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328"><tspan x="56" dy="0">and does not end the program. Every update of the company's server waits for a second signal.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">The first request to shut down is ignored</tspan></text>
<rect x="840" y="30" width="112.7" height="22" rx="11" fill="#f97316"/>
<text x="896.4" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-06 · Medium</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">A hosting system stops a program with the signal SIGTERM. Plain Node exits at once; with the package it does not.</tspan></text>
<g filter="url(#wob)">
<path d="M38.3 447.6 Q256.3 445.8 469.7 446.4 Q468.6 491.2 471.8 535.1 Q257.7 535.6 39.6 533.9 Q40.2 488.5 38.3 447.6" fill="#f3faf6" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#10b981" font-weight="700"><tspan x="54" dy="0">A vendor can do this today</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Own handler, `process.on('SIGTERM', () =&gt;</tspan><tspan x="54" dy="16.5">process.exit(0))`: the first signal ended it in 4 ms.</tspan></text>
<path d="M490.3 447.7 Q706.4 448.0 918.8 447.8 Q921.6 488.3 921.5 532.8 Q705.8 533.9 491.5 535.2 Q493.2 491.4 490.3 447.7" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="504" dy="0">After the queue is flushed, send the signal again (P3):</tspan><tspan x="504" dy="16.5">the first SIGTERM ended it in 3 ms.</tspan></text>
</g>
</svg>