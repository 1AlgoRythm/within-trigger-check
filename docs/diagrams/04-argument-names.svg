<text x="500" y="300" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#1f2328"><tspan x="500" dy="0">The README says identity-like fields in parameters</tspan></text>
<text x="500" y="322" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#1f2328"><tspan x="500" dy="0">are removed or redacted. These are identity-like:</tspan></text>
<text x="500" y="346" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#ef4444" font-weight="700"><tspan x="500" dy="0">name, address, dob, ip, customer</tspan></text>
<text x="44" y="300" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="44" dy="0">password, token, api_key, secret, email, ssn, phone …</tspan></text>
<text x="44" y="320" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="44" dy="0">the words on the list: the value is replaced.</tspan></text>
