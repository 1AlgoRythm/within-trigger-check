<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A tool's required inputs go from query to query and context; the model also sees get_more_tools; a call without context still worked">
<title>A tool's required inputs go from query to query and context; the model also sees get_more_tools; a call without context still worked</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M40.2 118.1 Q237.9 118.7 438.6 119.8 Q439.2 196.6 441.9 268.8 Q240.0 270.6 39.4 270.2 Q39.2 194.4 40.2 118.1" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="146" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">The vendor's tool, as written</tspan></text>
<text x="54" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="600"><tspan x="54" dy="0">search_companies</tspan></text>
<rect x="54" y="192" width="151.7" height="21.5" rx="6" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
<text x="61" y="206.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328">query  (required)</text>
<path d="M442 195 Q482.8 192.2 520 195" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M509.1 199.9 L520 195 L509.9 188.5" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M523.3 118.2 Q721.8 121.3 918.0 121.3 Q917.1 194.7 919.1 268.9 Q720.3 268.5 522.3 270.7 Q524.0 192.2 523.3 118.2" fill="#fff7ed" stroke="#f97316" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="538" y="146" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="538" dy="0">After track()</tspan></text>
<text x="538" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="600"><tspan x="538" dy="0">search_companies</tspan></text>
<rect x="538" y="192" width="151.7" height="21.5" rx="6" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
<text x="545" y="206.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328">query  (required)</text>
<rect x="538" y="222" width="297.5" height="21.5" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="545" y="236.5" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328">context  (required, 15 to 25 words)</text>
<path d="M39.8 296.8 Q238.7 296.2 441.4 295.4 Q441.4 353.5 439.5 416.5 Q238.9 417.2 38.3 417.0 Q38.7 357.6 39.8 296.8" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="322" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">The model also sees one more tool</tspan></text>
<text x="54" y="350" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="600"><tspan x="54" dy="0">get_more_tools</tspan></text>
<text x="54" y="374" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">&quot;check for additional tools whenever your</tspan></text>
<text x="54" y="392" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">task might benefit from specialized capabilities&quot;</tspan></text>
<path d="M478.4 294.5 Q697.8 294.6 919.7 296.7 Q920.9 353.8 920.8 414.4 Q698.0 416.4 480.2 416.3 Q481.5 354.4 478.4 294.5" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="494" y="322" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="494" dy="0">A call without context</tspan></text>
<text x="494" y="366" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="26" fill="#f97316" font-weight="700"><tspan x="494" dy="0">still worked</tspan></text>
<text x="494" y="392" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="494" dy="0">so &quot;required&quot; asks for more than the server enforces</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">Every tool gets a required context input, plus one tool</tspan></text>
<rect x="840" y="30" width="90.4" height="22" rx="11" fill="#3b82f6"/>
<text x="885.2" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-10 · Low</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">After track(), each tool gains a required text, context, that asks the model for 15 to 25 words. One more tool appears.</tspan></text>
<g filter="url(#wob)">
<path d="M41.9 444.9 Q257.1 447.0 468.2 447.9 Q468.0 492.7 469.8 533.0 Q254.6 531.7 41.5 533.1 Q42.1 488.1 41.9 444.9" fill="#f3faf6" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#10b981" font-weight="700"><tspan x="54" dy="0">A vendor can do this today</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Two documented switches, `enableToolCallContext` and</tspan><tspan x="54" dy="16.5">`enableReportMissing`, set to false leave the tool list</tspan><tspan x="54" dy="16.5">as written.</tspan></text>
<path d="M491.0 446.6 Q705.5 445.1 919.2 447.4 Q919.9 490.0 919.0 534.1 Q704.5 536.2 491.1 534.6 Q490.8 490.2 491.0 446.6" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="504" dy="0">Do not mark context as required, because the server does</tspan><tspan x="504" dy="16.5">not enforce it (P5): required becomes query.</tspan></text>
</g>
</svg>