<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-label="The PII gap: the SDK adds a context field to every tool, the model writes the user's goal there, and the SDK sends it as mcpIntent to Within on every call even with captureArguments off. Emails, keys and card numbers were redacted, phone numbers were not. After the fix phone numbers become [redacted]; names still pass, so the real fix is opt-in.">
<title>The PII gap: what leaves the vendor's server</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.hot{fill:var(--red);animation:blink 1s steps(1) infinite}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.r{fill:var(--red)}.g{fill:var(--grn)}.b{fill:var(--blu)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="640" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">8 · The PII gap: what leaves the vendor's server</text>
<text x="30" y="70" class="s">PII = personally identifiable information: names, phone numbers, emails. Within's homepage: "PII redacted before storage".</text>

<g filter="url(#wobble)">
  <rect x="30" y="95" width="290" height="160" rx="12" class="blu"/>
  <rect x="355" y="95" width="290" height="160" rx="12" class="ink"/>
  <rect x="680" y="95" width="290" height="160" rx="12" class="org"/>
  <path d="M320 175 L350 175" class="flow" marker-end="url(#ah)"/>
  <path d="M645 175 L675 175" class="flow" marker-end="url(#ah)"/>
</g>
<text x="45" y="122" class="l b">① SDK adds a field</text>
<text x="45" y="146" class="s">to every registerTool tool's inputs:</text>
<text x="45" y="170" class="m">context: "Why are you calling</text>
<text x="45" y="188" class="m"> this tool? Briefly describe</text>
<text x="45" y="206" class="m"> the user's goal."  (≤300)</text>
<text x="45" y="236" class="s">wrapped or not, not app-only (we checked)</text>
<text x="370" y="122" class="l">② the AI fills it in</text>
<text x="370" y="150" class="m">"User Priya Raman</text>
<text x="370" y="168" class="m hot">(555-201-3344)</text>
<text x="370" y="186" class="m">wants fintech leads for</text>
<text x="370" y="204" class="m">her Boston fund"</text>
<text x="370" y="236" class="s">an example sentence (like our probe's)</text>
<text x="695" y="122" class="l o">③ sent when it is filled in</text>
<text x="695" y="146" class="m">POST /v1/activity</text>
<text x="695" y="166" class="m">  mcpIntent: "…"</text>
<text x="695" y="194" class="s">even with</text>
<text x="695" y="214" class="m">captureArguments: false</text>
<text x="695" y="236" class="s">(the default)</text>

<text x="30" y="292" class="l">What the SDK's redaction (redactMcpIntent) catches:</text>
<g filter="url(#wobble)">
  <rect x="30" y="305" width="185" height="70" rx="10" class="grn"/>
  <rect x="225" y="305" width="185" height="70" rx="10" class="grn"/>
  <rect x="420" y="305" width="185" height="70" rx="10" class="grn"/>
  <rect x="615" y="305" width="170" height="70" rx="10" class="red"/>
  <rect x="795" y="305" width="175" height="70" rx="10" class="red"/>
</g>
<text x="45" y="335" class="l g">✓ emails</text><text x="45" y="358" class="s">→ [redacted]</text>
<text x="240" y="335" class="l g">✓ API keys, tokens</text><text x="240" y="358" class="s">sk-, sb_, Bearer</text>
<text x="435" y="335" class="l g">✓ card numbers</text><text x="435" y="358" class="s">(Luhn check)</text>
<text x="630" y="335" class="l r">✗ phone numbers</text><text x="630" y="358" class="s">sent as written</text>
<text x="810" y="335" class="l r">✗ names</text><text x="810" y="358" class="s">a regex can't spot them</text>

<g filter="url(#wobble)"><rect x="30" y="400" width="940" height="105" rx="14" class="grn"/></g>
<text x="50" y="430" class="l g">Our fix: one phone pattern (10–15 digits)</text>
<text x="50" y="456" class="m">"User Priya Raman ([redacted]) wants fintech leads…"</text>
<text x="50" y="482" class="s">Kept: "40 seats", "2026-12", 8-digit order numbers.  Trade-off: a long ID such as "1234 5678 9012" is hidden too.</text>

<g filter="url(#wobble)"><rect x="30" y="525" width="940" height="90" rx="14" class="org"/></g>
<text x="50" y="555" class="l">Still not solved: names. The real fix is a design choice:</text>
<text x="50" y="580" class="s">send the context text only when the vendor opts in, and list it in the docs table "What leaves your server".</text>
<text x="50" y="602" class="s">(Within's server may redact more after it arrives. We can't see it, so the claim is "reaches the API unredacted".)</text>
</svg>
