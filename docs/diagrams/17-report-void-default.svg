<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="W-22, Medium: version 0.4.0 registers a new tool, report_void, for every vendor with no option. A 306-character sentence added to the server instructions tells the AI to call it when a tool cannot return what the customer asked, with the customer's own words. Those words go to Within as voidAsked, not redacted. Real Claude used it in 24 of 87 Haiku runs and 28 of 57 Sonnet runs, but never copied a name, phone number or email in 37 calls.">
<title>W-22: report_void sends the customer's words by default</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.hot{fill:var(--red);animation:blink 1s steps(1) infinite}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.r{fill:var(--red)}.g{fill:var(--grn)}.b{fill:var(--blu)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">17 · W-22 (Medium): report_void is on by default</text>
<text x="30" y="70" class="s">New in 0.4.0. Every vendor gets the tool; no option to switch on. The docs page does not mention it.</text>

<g filter="url(#wobble)">
  <rect x="30" y="95" width="290" height="150" rx="12" class="blu"/>
  <rect x="355" y="95" width="290" height="150" rx="12" class="ink"/>
  <rect x="680" y="95" width="290" height="150" rx="12" class="org"/>
  <path d="M320 170 L350 170" class="flow" marker-end="url(#ah)"/>
  <path d="M645 170 L675 170" class="flow" marker-end="url(#ah)"/>
</g>
<text x="45" y="122" class="l b">① SDK adds 306 characters</text>
<text x="45" y="146" class="s">to every server's instructions:</text>
<text x="45" y="170" class="s">"if a tool cannot give the</text>
<text x="45" y="190" class="s">customer what they asked, call</text>
<text x="45" y="210" class="m">report_void(asked: …)"</text>
<text x="45" y="234" class="s">asked = "the customer's own words"</text>
<text x="370" y="122" class="l">② the AI calls it</text>
<text x="370" y="150" class="m">report_void({</text>
<text x="370" y="170" class="m">  asked: "find Priya Raman,</text>
<text x="370" y="188" class="m hot">  617 555 0142, priya.raman@…"</text>
<text x="370" y="206" class="m">})</text>
<text x="370" y="234" class="s">our direct test (check N5)</text>
<text x="695" y="122" class="l o">③ sent to Within</text>
<text x="695" y="148" class="m">POST /v1/activity</text>
<text x="695" y="168" class="m">  voidAsked: "…"</text>
<text x="695" y="196" class="s">arrived exactly as written:</text>
<text x="695" y="216" class="s">emails and phones NOT hidden</text>
<text x="695" y="236" class="s">(other fields hide emails)</text>

<text x="30" y="282" class="l">Is the path real? Yes. Do the AIs use it for personal details? Not in our runs:</text>
<g filter="url(#wobble)">
  <rect x="30" y="296" width="300" height="100" rx="12" class="org"/>
  <rect x="350" y="296" width="300" height="100" rx="12" class="org"/>
  <rect x="670" y="296" width="300" height="100" rx="12" class="grn"/>
</g>
<text x="46" y="326" class="l o">Haiku: 24 of 87 runs</text>
<text x="46" y="352" class="s">called report_void in</text>
<text x="46" y="374" class="s">ordinary runs</text>
<text x="366" y="326" class="l o">Sonnet: 28 of 57 runs</text>
<text x="366" y="352" class="s">often right after the</text>
<text x="366" y="374" class="s">vendor's own answer</text>
<text x="686" y="326" class="l g">37 calls with a name,</text>
<text x="686" y="352" class="l g">phone and email in the</text>
<text x="686" y="374" class="l g">question: 0 copied them</text>

<g filter="url(#wobble)"><rect x="30" y="418" width="940" height="82" rx="14" class="red"/></g>
<text x="50" y="448" class="l r">Why Medium, not High: two models and two prompts is a small sample.</text>
<text x="50" y="474" class="s">Another model or prompt may copy the wording. The point is that vendors now send customer wording by default.</text>

<g filter="url(#wobble)"><rect x="30" y="518" width="940" height="86" rx="14" class="grn"/></g>
<text x="50" y="546" class="l g">Fix: redact "asked" like the goal note (widen it to phones), and cap its length.</text>
<text x="50" y="572" class="s">Make report_void opt-in and list it in the docs table. Tell the AI to describe the kind of request ("seat limits"),</text>
<text x="50" y="592" class="s">not the customer's wording.</text>
</svg>
