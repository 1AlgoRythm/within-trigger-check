<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">The app reports itself</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">hostName: &quot;claude-ai&quot;</tspan></text>
<text x="54" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">detected by: initialize</tspan></text>
<path d="M500.3 121.3 Q710.6 120.2 919.4 119.8 Q917.9 196.5 919.7 270.7 Q708.7 271.1 501.9 269.5 Q502.2 196.9 500.3 121.3" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="514" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="514" dy="0">Only a browser's user-agent text</tspan></text>
<text x="514" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="514" dy="0">hostName: &quot;Mozilla/5.0 (Macintosh; Intel Mac OS …&quot;</tspan></text>
<text x="514" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="514" dy="0">80 of the header's 146 characters, sent as the app name</tspan></text>
<text x="40" y="320" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">Check N4. The code sends the header only if it names claude, chatgpt, openai or cursor. The text also carries the operating system.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">A browser's user-agent text is sent as the app name</tspan></text>
<rect x="840" y="30" width="90.4" height="22" rx="11" fill="#3b82f6"/>
<text x="885.2" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-23 · Low</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">If the AI app does not report its name, the SDK falls back to the user-agent text and sends 80 characters of it.</tspan></text>
