<text x="40" y="400" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="40" dy="0">The docs table lists what the filter hides; the goal text itself is not listed as something that leaves.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">The goal text goes out with private details in it</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-10 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The goal text the model writes goes to Within by default. The filter hides some details and lets the rest through.</tspan></text>
<g filter="url(#wob)">
<path d="M38.7 447.9 Q477.6 444.7 918.4 445.1 Q920.9 490.2 919.0 534.3 Q480.6 533.4 38.1 533.1 Q37.8 489.5 38.7 447.9" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="54" dy="0">What Within should change</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">List the note in the docs table.</tspan></text>
