<text x="718.5999999999999" y="209" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328">person_name</text>
<rect x="480" y="222" width="208.4" height="20" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="487" y="235" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328">stripe_style_key (sk_live_)</text>
