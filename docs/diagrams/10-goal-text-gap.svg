<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="9 of 15 kinds of detail went out unredacted">
<title>9 of 15 kinds of detail went out unredacted</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M40.1 105.8 Q480.3 103.5 920.4 104.3 Q917.7 128.3 918.7 151.8 Q478.8 153.2 40.9 152.2 Q40.8 129.2 40.1 105.8" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="126" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328"><tspan x="56" dy="0">By default the goal text is sent: &quot;wants fintech leads for a Boston fund&quot;</tspan></text>
<text x="56" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e"><tspan x="56" dy="0">We put 15 kinds of private detail into one goal text and read what arrived.</tspan></text>
<text x="40" y="182" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#10b981" font-weight="700"><tspan x="40" dy="0">Hidden (6)</tspan></text>
<text x="480" y="182" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#ef4444" font-weight="700"><tspan x="480" dy="0">Went out unredacted (9)</tspan></text>
