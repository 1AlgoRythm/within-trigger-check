<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">The `log` option takes a callback: 5 lines went to the</tspan><tspan x="54" dy="16.5">vendor's own code and 0 bytes were added to the file.</tspan></text>
