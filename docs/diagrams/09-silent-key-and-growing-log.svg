<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="504" dy="0">Fail loudly at start-up when no key and no exporter are</tspan><tspan x="504" dy="16.5">set, or log to the console.</tspan></text>
