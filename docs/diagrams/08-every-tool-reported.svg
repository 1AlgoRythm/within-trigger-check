<text x="654" y="366" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328" font-weight="600"><tspan x="654" dy="0">an option to leave one out?</tspan></text>
<text x="654" y="392" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="15" fill="#ef4444" font-weight="700"><tspan x="654" dy="0">none in the code or the types</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">Every tool call is reported, and none can be left out</tspan></text>
<rect x="840" y="30" width="112.7" height="22" rx="11" fill="#f97316"/>
<text x="896.4" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-08 · Medium</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">track() wraps the whole server. A tool registered after track() was reported too, and no option leaves a tool out.</tspan></text>
<g filter="url(#wob)">
<path d="M38.7 446.0 Q253.4 447.3 469.0 447.9 Q468.0 492.6 468.5 534.9 Q252.2 537.2 39.1 535.1 Q39.7 489.1 38.7 446.0" fill="#f3faf6" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#10b981" font-weight="700"><tspan x="54" dy="0">A vendor can do this today</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">No vendor option leaves one tool out. A vendor can only</tspan><tspan x="54" dy="16.5">strip what leaves (W-02, W-03).</tspan></text>
<path d="M489.9 446.7 Q704.1 444.8 920.0 445.3 Q918.9 490.4 921.6 533.3 Q707.5 533.4 490.3 535.2 Q491.9 489.0 489.9 446.7" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="504" dy="0">Offer an option to leave named tools out, and say in the</tspan><tspan x="504" dy="16.5">README that every tool is reported.</tspan></text>
