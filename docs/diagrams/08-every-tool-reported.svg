<text x="722" y="252" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" fill="#1f2328" font-weight="700"><tspan x="722" dy="0">Within</tspan></text>
<text x="722" y="278" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="722" dy="0">gets all three</tspan></text>
