<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="What we built: prompts.json feeds runner.mjs, which starts claude -p per prompt, connected to acme-mcp.mjs with the Within SDK, which reports to within-relay.mjs in stub or proxy mode; server.mjs and index.html show recall, precision and payloads; repeat.mjs reruns prompts; fixes/apply.mjs patches the SDK.">
<title>Trigger check: the five parts we built, and the one part that is Within's</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.o{fill:var(--org)}.b{fill:var(--blu)}.g{fill:var(--grn)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">3 · What we built: Trigger check</text>
<text x="30" y="70" class="s"><tspan class="o">Orange = what we built.</tspan> <tspan class="b">Blue = Within's real SDK</tspan>, patched only by this repo's fixes. One run = 20 questions.</text>

<g filter="url(#wobble)">
  <rect x="30" y="105" width="175" height="150" rx="12" class="org"/>
  <rect x="240" y="105" width="225" height="150" rx="12" class="org"/>
  <rect x="495" y="95" width="240" height="170" rx="12" class="blu"/>
  <rect x="765" y="105" width="210" height="150" rx="12" class="org"/>
  <path d="M205 180 L240 180" class="flow" marker-end="url(#ah)"/>
  <path d="M465 180 L490 180" class="flow" marker-end="url(#ah)"/>
  <path d="M735 180 L760 180" class="flow" marker-end="url(#ah)"/>
  <rect x="245" y="320" width="480" height="130" rx="12" class="org"/>
  <path d="M800 258 Q770 300 730 345" class="flow" marker-end="url(#ah)"/>
  <path d="M350 255 L350 315" class="flow" marker-end="url(#ah)"/>
  <rect x="30" y="320" width="175" height="130" rx="12" class="org"/>
  <rect x="765" y="320" width="215" height="130" rx="12" class="org"/>
</g>
<text x="45" y="132" class="l o">questions</text>
<text x="45" y="154" class="m">prompts.json</text>
<text x="45" y="180" class="s">10 buying</text>
<text x="45" y="200" class="s">10 normal, with traps:</text>
<text x="45" y="220" class="s">plan, security, billing,</text>
<text x="45" y="240" class="s">cancel, cost, compare, help</text>

<text x="260" y="132" class="l o">robot customer</text>
<text x="260" y="154" class="m">app/runner.mjs</text>
<text x="260" y="178" class="m">claude -p "question"</text>
<text x="260" y="198" class="s">fresh session each time</text>
<text x="255" y="218" class="m">--tools "" (no web search)</text>
<text x="260" y="238" class="m">--strict-mcp-config</text>

<text x="510" y="122" class="l b">fake vendor + real SDK</text>
<text x="510" y="144" class="m">server/acme-mcp.mjs</text>
<text x="510" y="168" class="s">built from Within's quickstart</text>
<text x="508" y="190" class="m">search_companies,get_company</text>
<text x="510" y="212" class="m">+ @getwithin/sdk 0.3.0</text>
<text x="510" y="232" class="s">(get_vendor_answer etc.)</text>
<text x="510" y="252" class="s">talks over stdio to Claude</text>

<text x="780" y="132" class="l o">stand-in for Within</text>
<text x="780" y="154" class="m">server/within-relay.mjs</text>
<text x="780" y="178" class="s">listens on 127.0.0.1:8787</text>
<text x="780" y="198" class="s">(the SDK's default address)</text>
<text x="780" y="218" class="s">stub: canned answers</text>
<text x="780" y="238" class="s">proxy: → app.getwith.in</text>

<text x="260" y="348" class="l o">scoreboard page</text>
<text x="260" y="370" class="m">app/server.mjs + app/index.html  → http://127.0.0.1:5180</text>
<text x="260" y="394" class="s">recall · precision · accuracy · median time</text>
<text x="260" y="416" class="s">click a row: Claude's tool calls, its reply,</text>
<text x="260" y="436" class="s">and every request the SDK sent toward Within</text>
<text x="520" y="300" class="s">each call is recorded (not the install ping)</text>

<text x="45" y="348" class="l o">repeat</text>
<text x="45" y="370" class="m">app/repeat.mjs</text>
<text x="45" y="394" class="s">same question ×N (5 default),</text>
<text x="45" y="414" class="s">because one run is</text>
<text x="45" y="434" class="s">one coin flip</text>

<text x="780" y="348" class="l o">the fixes (ours)</text>
<text x="780" y="370" class="m">fixes/apply.mjs</text>
<text x="780" y="394" class="s">patches the installed SDK:</text>
<text x="780" y="414" class="s">Zod · phone redaction ·</text>
<text x="780" y="434" class="s">wording · undo: npm run unfix</text>

<g filter="url(#wobble)"><rect x="30" y="480" width="945" height="110" rx="14" class="grn"/></g>
<text x="52" y="510" class="l g">Run it in three commands</text>
<text x="52" y="538" class="m">npm install  →  npm run fix -- --wording  →  npm start</text>
<text x="52" y="566" class="s">Needs Node 20+ and Claude Code signed in. Real Within API: WITHIN_MODE=proxy SUPPORTBRIDGE_API_KEY=sb_... npm start</text>
</svg>
