<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="W-24, Medium: with the hubs option on, after each wrapped tool call the SDK asks Within for an invitation line, appends it to the vendor's own tool result as an extra text block, adds hubInvitation and an open_hub step, and the server instructions tell the AI to say it to the customer. In 40 of 40 real-Claude runs the AI repeated it, including 20 of 20 where the user said not to send anything. It never opened the hub itself.">
<title>W-24: Within's text appears inside the vendor's tool result</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
.flowb{fill:none;stroke:var(--blu);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite reverse}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.hot{fill:var(--red);animation:blink 1s steps(1) infinite}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.r{fill:var(--red)}.g{fill:var(--grn)}.b{fill:var(--blu)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">19 · W-24 (Medium): Within's words inside the vendor's answer</text>
<text x="30" y="70" class="s">New in 0.4.0, only with hubs: true (off by default). Within's docs say: "Your tool result stays intact."</text>

<g filter="url(#wobble)">
  <rect x="30" y="95" width="290" height="160" rx="12" class="blu"/>
  <rect x="355" y="95" width="290" height="160" rx="12" class="org"/>
  <rect x="680" y="95" width="290" height="160" rx="12" class="ink"/>
  <path d="M320 150 L350 150" class="flow" marker-end="url(#ah)"/>
  <path d="M350 200 L320 200" class="flowb" marker-end="url(#ah)"/>
  <path d="M645 175 L675 175" class="flow" marker-end="url(#ah)"/>
</g>
<text x="45" y="122" class="l b">① vendor tool runs</text>
<text x="45" y="148" class="s">after each wrapped call the</text>
<text x="45" y="168" class="s">SDK asks Within:</text>
<text x="45" y="190" class="m">POST /v1/hubs/invite</text>
<text x="45" y="210" class="s">(session id + tool name)</text>
<text x="45" y="236" class="s">attachHubLine() edits the result</text>
<text x="370" y="122" class="l o">② Within answers with a line</text>
<text x="370" y="150" class="m">line: "You have 2 new</text>
<text x="370" y="168" class="m hot">introductions waiting…"</text>
<text x="370" y="196" class="s">we used our own stand-in text;</text>
<text x="370" y="216" class="s">the real wording is invisible</text>
<text x="370" y="236" class="s">from outside</text>
<text x="695" y="122" class="l">③ the vendor's result now has</text>
<text x="695" y="148" class="s">+ an extra text block (the line)</text>
<text x="695" y="168" class="s">+ structuredContent.hubInvitation</text>
<text x="695" y="188" class="s">+ { tool: "open_hub" } in next</text>
<text x="695" y="214" class="s">server instructions tell the AI:</text>
<text x="695" y="234" class="s">"say that one sentence"</text>

<text x="30" y="292" class="l">What real Claude did (hubs on, stand-in replying with a line, Haiku and Sonnet):</text>
<g filter="url(#wobble)">
  <rect x="30" y="306" width="300" height="100" rx="12" class="red"/>
  <rect x="350" y="306" width="300" height="100" rx="12" class="red"/>
  <rect x="670" y="306" width="300" height="100" rx="12" class="grn"/>
</g>
<text x="46" y="336" class="l r">repeated it: 40 of 40</text>
<text x="46" y="362" class="s">the AI told the customer</text>
<text x="46" y="384" class="s">Within's sentence</text>
<text x="366" y="336" class="l r">20 of 20 even when told</text>
<text x="366" y="362" class="s">"don't open any hub or</text>
<text x="366" y="384" class="s">send anything"</text>
<text x="686" y="336" class="l g">opened the hub: 0 of 40</text>
<text x="686" y="362" class="s">it never acted on the offer</text>
<text x="686" y="384" class="s">by itself (check N8: gap)</text>

<g filter="url(#wobble)"><rect x="30" y="428" width="940" height="74" rx="14" class="org"/></g>
<text x="50" y="458" class="l o">Why it matters: a vendor who turns hubs on lets Within's server put text into</text>
<text x="50" y="484" class="s">answers the vendor wrote, and the AI shows that text to the customer. The hubs option is not on the docs page.</text>

<g filter="url(#wobble)"><rect x="30" y="520" width="940" height="84" rx="14" class="grn"/></g>
<text x="50" y="550" class="l g">Fix: keep Within's text out of the vendor's result (carry it in _meta, or show it only on the card).</text>
<text x="50" y="576" class="s">List the hubs option in the docs table, and mark the line so the AI can tell it comes from Within, not the vendor.</text>
</svg>
