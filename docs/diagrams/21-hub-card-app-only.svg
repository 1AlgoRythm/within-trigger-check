<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="W-26, Low: hub_card is labelled app-only (visibility app) and described as not called by the model, but the SDK does not check who calls it. A plain MCP client called hub_card with action send and the text reached Within as POST /v1/hubs/send unchanged. Only a host that honours the label keeps the AI away. In 40 real-Claude runs the AI called hub_card 0 times.">
<title>W-26: hub_card is app-only by label, not by check</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
.flowr{fill:none;stroke:var(--red);stroke-width:3.4;stroke-dasharray:8 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.hot{fill:var(--red);animation:blink 1s steps(1) infinite}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.r{fill:var(--red)}.g{fill:var(--grn)}.b{fill:var(--blu)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">21 · W-26 (Low): "app-only" is a label, not a lock</text>
<text x="30" y="70" class="s">New in 0.4.0, with hubs on. hub_card is meant for the card on screen, never for the AI.</text>

<g filter="url(#wobble)">
  <rect x="30" y="95" width="450" height="130" rx="12" class="blu"/>
  <rect x="520" y="95" width="450" height="130" rx="12" class="ink"/>
</g>
<text x="46" y="124" class="l b">what the code says</text>
<text x="46" y="150" class="m">_meta.ui.visibility: ["app"]</text>
<text x="46" y="172" class="s">description: "The model does not call this"</text>
<text x="46" y="198" class="s">hosts are meant to hide it from the AI</text>
<text x="536" y="124" class="l">what the code checks</text>
<text x="536" y="150" class="s">the handler has no caller check:</text>
<text x="536" y="172" class="m">seen · dismiss · send · refresh</text>
<text x="536" y="198" class="s">run for ANY caller (dist/index.js line 4148)</text>

<text x="30" y="266" class="l">Two callers, one tool:</text>
<g filter="url(#wobble)">
  <rect x="30" y="280" width="210" height="80" rx="12" class="grn"/>
  <rect x="30" y="378" width="210" height="80" rx="12" class="red"/>
  <rect x="360" y="280" width="270" height="178" rx="12" class="ink"/>
  <rect x="750" y="280" width="220" height="178" rx="12" class="org"/>
  <path d="M240 320 L355 350" class="flow" marker-end="url(#ah)"/>
  <path d="M240 418 L355 390" class="flowr" marker-end="url(#ah)"/>
  <path d="M630 369 L745 369" class="flow" marker-end="url(#ah)"/>
</g>
<text x="46" y="308" class="l g">the card on screen</text>
<text x="46" y="334" class="s">the intended caller</text>
<text x="46" y="406" class="l r">any MCP client</text>
<text x="46" y="432" class="s">our check N9 did this</text>
<text x="376" y="316" class="l">hub_card on the vendor's</text>
<text x="376" y="340" class="l">server</text>
<text x="376" y="372" class="m">action: "send"</text>
<text x="376" y="392" class="m hot">text: "hello from a plain…"</text>
<text x="376" y="424" class="s">no check who is calling</text>
<text x="766" y="316" class="l o">Within's API</text>
<text x="766" y="346" class="m">POST /v1/hubs/send</text>
<text x="766" y="370" class="s">text arrived</text>
<text x="766" y="390" class="s">unchanged (reply to</text>
<text x="766" y="410" class="s">caller: "didn't send")</text><text x="766" y="436" class="s">verdict: gap</text>

<g filter="url(#wobble)"><rect x="30" y="480" width="460" height="124" rx="14" class="org"/></g>
<text x="46" y="508" class="l o">Does the AI actually call it?</text>
<text x="46" y="534" class="s">Not in our runs: 0 calls in 40 real-Claude runs</text>
<text x="46" y="556" class="s">(Haiku and Sonnet, hubs on). A host that shows</text>
<text x="46" y="578" class="s">every tool to the AI would change that.</text>
<g filter="url(#wobble)"><rect x="510" y="480" width="460" height="124" rx="14" class="grn"/></g>
<text x="526" y="508" class="l g">Fix</text>
<text x="526" y="534" class="s">Refuse hub_card calls that don't come from the card,</text>
<text x="526" y="556" class="s">for example with a one-time value only the card holds</text>
<text x="526" y="578" class="s">(same fix as W-18). Don't list app-only tools to clients</text>
<text x="526" y="598" class="s">that didn't say they support apps.</text>
</svg>
