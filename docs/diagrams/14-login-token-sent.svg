<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="With the option on the token was sent: true. By default: false">
<title>With the option on the token was sent: true. By default: false</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M38.1 118.8 Q163.4 117.5 290.3 118.9 Q291.8 169.5 290.0 219.7 Q165.5 221.0 39.8 220.9 Q37.8 168.0 38.1 118.8" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">The customer's call</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">carries a signed login token</tspan></text>
<path d="M292 170 Q346.8 166.9 400 170" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M389.2 175.1 L400 170 L389.8 163.6" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405.9 101.5 Q537.4 100.0 673.8 101.0 Q671.8 173.3 674.3 241.3 Q536.4 241.7 402.5 239.1 Q405.5 169.3 405.9 101.5" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="418" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="418" dy="0">identity option on</tspan></text>
<text x="418" y="146" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="418" dy="0">fields sent: 11</tspan></text>
<text x="418" y="165" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="418" dy="0">authToken: yes, as received</tspan></text>
<path d="M676 170 Q725.3 173.2 770 170" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M759.9 176.5 L770 170 L759.1 165.0" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M775.5 128.9 Q849.8 127.2 921.2 128.2 Q917.9 167.6 918.4 208.8 Q847.2 211.0 774.6 211.3 Q772.7 171.8 775.5 128.9" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="154" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="700"><tspan x="788" dy="0">Within</tspan></text>
<text x="788" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="788" dy="0">holds a token</tspan></text>
<path d="M404.7 269.1 Q540.8 270.6 675.3 270.3 Q676.6 317.2 675.5 361.4 Q540.7 359.2 403.8 361.8 Q404.6 314.5 404.7 269.1" fill="#f3faf6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="418" y="294" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="418" dy="0">identity option off</tspan></text>
<text x="418" y="316" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="418" dy="0">authToken sent: false</tspan></text>
<text x="40" y="392" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="40" dy="0">Within's docs list the raw bearer token under what stays on the vendor's server. Whether Within's server verifies it is not visible.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">The customer's login token is sent to Within</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-21 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">With the new identity option on, the signed login token of the customer travels to Within with every tool call.</tspan></text>
<g filter="url(#wob)">
<path d="M41.3 444.3 Q482.8 445.2 920.0 446.2 Q918.7 488.2 919.0 534.6 Q481.1 533.3 38.8 533.0 Q39.1 489.0 41.3 444.3" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="54" dy="0">What Within should change</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Do not send the token. The report already carries the verified user id and, in 0.4.0, `authIssuer`.</tspan></text>
</g>
</svg>