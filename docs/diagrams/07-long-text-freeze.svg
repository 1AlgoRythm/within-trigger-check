<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The email pattern in the privacy filter slows down fast on unbroken text. While it runs, nobody is answered.</tspan></text>
