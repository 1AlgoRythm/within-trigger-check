<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Cut the text to about 1,000 characters before any pattern runs (the output is cut to 200 anyway).</tspan></text>
