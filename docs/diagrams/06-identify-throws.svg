<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="54" dy="0">identityOf, dist/index.js line 1742: await identify(...)</tspan><tspan x="54" dy="15.84">runs outside any try/catch.</tspan></text>
