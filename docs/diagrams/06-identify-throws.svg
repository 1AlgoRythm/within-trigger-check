<text x="56" y="298" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328"><tspan x="56" dy="0">Check A7 (gap): &quot;tool call failed: session store is down. The vendor's own handler had already run: true&quot;</tspan></text>
<text x="56" y="324" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="56" dy="0">The tool did its work, but the customer gets an error. A helper's failure should not become the customer's.</tspan></text>
