<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The SDK asks the vendor's function who the customer is. If it throws, the whole tool call fails.</tspan></text>
