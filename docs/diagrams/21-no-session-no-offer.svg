<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">same id every call: true</tspan></text>
<path d="M480.9 118.7 Q701.3 122.7 920.6 121.8 Q921.1 181.9 918.0 239.9 Q700.7 240.2 479.8 241.0 Q478.7 177.5 480.9 118.7" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="494" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="494" dy="0">Three separate connections</tspan></text>
<text x="494" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="494" dy="0">3 different ids</tspan></text>
<rect x="500" y="198" width="45.2" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="507" y="212" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">id 1</text>
<rect x="630" y="198" width="45.2" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="637" y="212" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">id 2</text>
<rect x="760" y="198" width="45.2" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="767" y="212" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">id 3</text>
<text x="40" y="290" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#59636e"><tspan x="40" dy="0">Check C9 ran 3 connections. A server that builds a new transport per request would get a new id each call (read from the code, not run).</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">Without sessions, an offer cannot find the customer</tspan></text>
<rect x="840" y="30" width="112.7" height="22" rx="11" fill="#f97316"/>
<text x="896.4" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-19 · Medium</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The SDK keeps one id per connection. A server that opens a new one per request cannot be found again by a rep.</tspan></text>
