<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="W-25, Low: the new getwithin-sdk doctor command lists a server's tools and flags any tool without a context input. A tool that has its own context input, the W-04 case where the SDK silently removes the vendor's field, also has that property, so doctor prints a pass. It cannot tell Within's field from the vendor's.">
<title>W-25: doctor passes a server that W-04 breaks</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.hot{fill:var(--red);animation:blink 1s steps(1) infinite}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.r{fill:var(--red)}.g{fill:var(--grn)}.b{fill:var(--blu)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">20 · W-25 (Low): the new doctor passes a broken server</text>
<text x="30" y="70" class="s">New in 0.4.0: the command  getwithin-sdk doctor  checks that a vendor's install is wired up correctly.</text>

<g filter="url(#wobble)">
  <rect x="30" y="95" width="290" height="150" rx="12" class="blu"/>
  <rect x="355" y="95" width="290" height="150" rx="12" class="ink"/>
  <rect x="680" y="95" width="290" height="150" rx="12" class="grn"/>
  <path d="M320 170 L350 170" class="flow" marker-end="url(#ah)"/>
  <path d="M645 170 L675 170" class="flow" marker-end="url(#ah)"/>
</g>
<text x="45" y="122" class="l b">① lists the server's tools</text>
<text x="45" y="148" class="s">over MCP (we ran the real</text>
<text x="45" y="168" class="s">command against a vendor</text>
<text x="45" y="188" class="s">server on 127.0.0.1)</text>
<text x="370" y="122" class="l">② the test it applies</text>
<text x="370" y="148" class="m">bare = tools whose</text>
<text x="370" y="166" class="m">inputSchema.properties</text>
<text x="370" y="184" class="m">has no "context"</text>
<text x="370" y="214" class="s">doctor.js line 320</text>
<text x="695" y="122" class="l g">③ prints</text>
<text x="695" y="152" class="m">✓ 1 of your tools carry</text>
<text x="695" y="170" class="m">  the context field</text>
<text x="695" y="204" class="s">a green pass …</text>

<text x="30" y="286" class="l">… but this vendor tool already has its OWN field named context (the W-04 case):</text>
<g filter="url(#wobble)">
  <rect x="30" y="300" width="450" height="130" rx="12" class="ink"/>
  <rect x="520" y="300" width="450" height="130" rx="12" class="red"/>
</g>
<text x="46" y="330" class="l">what the vendor wrote</text>
<text x="46" y="356" class="m">inputSchema: { context: z.string() }</text>
<text x="46" y="382" class="s">the vendor's code reads this value</text>
<text x="46" y="404" class="s">for its own purpose</text>
<text x="536" y="330" class="l r">what really happens (W-04)</text>
<text x="536" y="356" class="s">the SDK takes the value for itself</text>
<text x="536" y="378" class="s">and removes it before the vendor's</text>
<text x="536" y="400" class="s hot">code runs: the vendor's input is lost</text>
<path d="M480 365 L515 365" class="flow" marker-end="url(#ah)"/>

<g filter="url(#wobble)"><rect x="30" y="452" width="940" height="62" rx="14" class="red"/></g>
<text x="50" y="478" class="l r">doctor sees "has a context property" and says fine. It can't tell Within's field from the vendor's.</text>
<text x="50" y="502" class="s">A vendor who runs Within's own checker gets green while their input is silently removed (check N7: gap).</text>

<g filter="url(#wobble)"><rect x="30" y="530" width="940" height="76" rx="14" class="grn"/></g>
<text x="50" y="558" class="l g">Fix: mark the field the SDK adds (see W-04), and have doctor look for that mark.</text>
<text x="50" y="584" class="s">Add a doctor step: call a tool with its own context value and check that the vendor's code received it.</text>
</svg>
