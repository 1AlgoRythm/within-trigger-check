<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A chart of how long the server froze for 10,000 to 100,000 unbroken letters, from 59 ms to 4,395 ms">
<title>A chart of how long the server froze for 10,000 to 100,000 unbroken letters, from 59 ms to 4,395 ms</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M40.0 120.2 Q166.6 119.7 289.7 120.1 Q289.4 151.4 288.5 184.2 Q164.1 183.9 40.1 183.2 Q40.0 149.3 40.0 120.2" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="146" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328"><tspan x="56" dy="0">One argument:</tspan><tspan x="56" dy="18.48">100,000 letters, no spaces</tspan></text>
<path d="M165 186 Q164.8 206.8 165 232" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M159.2 221.5 L165 232 L170.7 221.4" fill="none" stroke="#59636e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M41.6 236.7 Q164.5 236.1 288.9 235.3 Q290.5 273.8 288.9 313.8 Q163.3 315.8 41.5 313.1 Q39.6 275.3 41.6 236.7" fill="#fff1f0" stroke="#ef4444" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="56" y="262" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="600"><tspan x="56" dy="0">The email pattern scans</tspan><tspan x="56" dy="18.48">the whole text first</tspan></text>
<text x="56" y="303" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#59636e"><tspan x="56" dy="0">then cuts it to the size limit</tspan></text>
<path d="M165 316 Q162.9 343.0 165 362" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M158.1 352.2 L165 362 L169.6 350.9" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M41.1 366.8 Q164.7 365.0 289.8 365.9 Q286.8 395.7 288.3 426.2 Q165.9 424.2 41.9 427.3 Q39.7 396.6 41.1 366.8" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="392" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328"><tspan x="56" dy="0">The whole process stops:</tspan><tspan x="56" dy="18.48">no customer is answered</tspan></text>
<path d="M360 392 Q646.0 395.9 930 392" fill="none" stroke="#1f2328" stroke-width="2.2" stroke-linecap="round"/>
<path d="M360 392 Q363.8 260.8 360 136" fill="none" stroke="#1f2328" stroke-width="2.2" stroke-linecap="round"/>
<text x="366" y="128" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="366" dy="0">How long the server froze (ms)</tspan></text>
<path d="M381.8 387.6 Q418.3 389.2 454.1 386.8 Q454.9 389.9 452.2 391.4 Q418.2 393.3 380.1 391.3 Q383.4 391.9 381.8 387.6" fill="#f97316" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="grow" style="animation-delay:0s"/>
<text x="417" y="380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle"><tspan x="417" dy="0">59</tspan></text>
<text x="417" y="412" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e" text-anchor="middle"><tspan x="417" dy="0">10,000</tspan></text>
<path d="M478.4 376.4 Q516.0 374.2 553.0 373.9 Q552.5 385.0 554.9 393.3 Q519.3 391.9 479.1 392.7 Q476.5 385.3 478.4 376.4" fill="#f97316" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="grow" style="animation-delay:0.18s"/>
<text x="517" y="366.7654152445961" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle"><tspan x="517" dy="0">313</tspan></text>
<text x="517" y="412" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e" text-anchor="middle"><tspan x="517" dy="0">25,000</tspan></text>
<path d="M582.0 332.1 Q616.9 333.2 655.9 332.2 Q654.6 362.9 652.3 393.2 Q617.7 393.4 580.1 390.5 Q581.0 359.7 582.0 332.1" fill="#f97316" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="grow" style="animation-delay:0.36s"/>
<text x="617" y="324.9178612059158" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle"><tspan x="617" dy="0">1,073</tspan></text>
<text x="617" y="412" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e" text-anchor="middle"><tspan x="617" dy="0">50,000</tspan></text>
<path d="M681.9 150.6 Q720.0 151.2 753.6 149.2 Q752.6 271.9 753.5 393.8 Q717.8 394.7 679.9 391.0 Q679.9 269.5 681.9 150.6" fill="#ef4444" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="grow" style="animation-delay:0.54s"/>
<text x="717" y="142" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle"><tspan x="717" dy="0">4,395</tspan></text>
<text x="717" y="412" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e" text-anchor="middle"><tspan x="717" dy="0">100,000</tspan></text>
<text x="380" y="430" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="380" dy="0">unbroken letters in one argument</tspan></text>
<path d="M800.1 388.6 Q837.7 386.4 874.1 387.2 Q873.1 388.6 872.6 393.4 Q836.6 392.6 801.9 393.5 Q800.5 391.0 800.1 388.6" fill="#10b981" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="grow" style="animation-delay:.8s"/>
<text x="837" y="380" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#1f2328" font-weight="700" text-anchor="middle"><tspan x="837" dy="0">17</tspan></text>
<text x="837" y="412" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e" text-anchor="middle"><tspan x="837" dy="0">100,000</tspan></text>
<text x="837" y="428" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e" text-anchor="middle"><tspan x="837" dy="0">ordinary words</tspan></text>
<text x="396" y="196" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="17" fill="#ef4444"><tspan x="396" dy="0">doubling the length</tspan></text>
<text x="396" y="218" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="17" fill="#ef4444"><tspan x="396" dy="0">about quadruples the time</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">One long run of letters freezes the whole server</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-01 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The vendor's tool answered in about 1 ms. The freeze comes after, while the event is cleaned.</tspan></text>
<g filter="url(#wob)">
<path d="M40.8 445.4 Q257.5 444.3 469.9 445.1 Q471.5 488.8 471.5 533.6 Q253.9 533.5 39.5 534.4 Q40.0 488.4 40.8 445.4" fill="#f3faf6" stroke="#10b981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#10b981" font-weight="700"><tspan x="54" dy="0">A vendor can do this today</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Own redaction function that cuts to 2,000 characters</tspan><tspan x="54" dy="16.5">first: 4,756 ms down to 16 ms.</tspan></text>
<path d="M489.6 444.1 Q706.6 444.2 921.5 444.9 Q921.6 488.2 921.7 535.2 Q705.1 531.5 490.4 532.5 Q492.3 489.4 489.6 444.1" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="504" dy="0">Cut the text before the email pattern runs (P1): 76 ms at</tspan><tspan x="504" dy="16.5">100,000 letters.</tspan></text>
</g>
</svg>