<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" aria-label="Architecture today versus steered, against MCP spec 2026-07-28: consent tool model-callable becomes app-only plus elicitation; the model-relayed chat moves into the card; session-keyed offers become user-bound handles; blocking model-written telemetry becomes async OpenTelemetry; deleted vendor instructions become append-only. Already right: saved answers, fail-open, handles, verified identity.">
<title>Architecture: where each decision should live</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:16.5px}.s{font-size:13.5px}.m{font-family:Menlo,monospace;font-size:12px}
.r{fill:var(--red)}.g{fill:var(--grn)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="700" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">9 · Architecture: who should own each decision</text>
<text x="30" y="70" class="s">Rule of thumb: the model routes; the user consents; code owns facts and state. Checked against MCP spec 2026-07-28 and the MCP Apps spec.</text>

<text x="200" y="102" class="l">decision</text><text x="330" y="102" class="l r">today (from the SDK source)</text><text x="680" y="102" class="l g">steered</text>

<g filter="url(#wobble)">
 <rect x="30" y="112" width="280" height="88" rx="10" class="ink"/><rect x="320" y="112" width="300" height="88" rx="10" class="red"/><rect x="665" y="112" width="305" height="88" rx="10" class="grn"/>
 <rect x="30" y="210" width="280" height="88" rx="10" class="ink"/><rect x="320" y="210" width="300" height="88" rx="10" class="red"/><rect x="665" y="210" width="305" height="88" rx="10" class="grn"/>
 <rect x="30" y="308" width="280" height="88" rx="10" class="ink"/><rect x="320" y="308" width="300" height="88" rx="10" class="red"/><rect x="665" y="308" width="305" height="88" rx="10" class="grn"/>
 <rect x="30" y="406" width="280" height="88" rx="10" class="ink"/><rect x="320" y="406" width="300" height="88" rx="10" class="red"/><rect x="665" y="406" width="305" height="88" rx="10" class="grn"/>
 <rect x="30" y="504" width="280" height="88" rx="10" class="ink"/><rect x="320" y="504" width="300" height="88" rx="10" class="red"/><rect x="665" y="504" width="305" height="88" rx="10" class="grn"/>
 <path d="M622 156 L660 156" class="flow" marker-end="url(#ah)"/><path d="M622 254 L660 254" class="flow" marker-end="url(#ah)"/><path d="M622 352 L660 352" class="flow" marker-end="url(#ah)"/><path d="M622 450 L660 450" class="flow" marker-end="url(#ah)"/><path d="M622 548 L660 548" class="flow" marker-end="url(#ah)"/>
</g>
<text x="45" y="140" class="l">① Does the customer want</text><text x="45" y="160" class="l">a person? → the USER</text><text x="45" y="184" class="s">(consent)</text>
<text x="335" y="138" class="m">confirm_assistance visible to</text><text x="335" y="156" class="m">the model ["model","app"]</text><text x="335" y="176" class="s">one-time click code optional:</text><text x="335" y="193" class="s">"A text host may omit it"</text>
<text x="680" y="138" class="m">visibility: ["app"] → only the</text><text x="680" y="156" class="s">card's button can call it.</text><text x="680" y="176" class="s">Text-only hosts: elicitation, a</text><text x="680" y="193" class="s">prompt the host draws itself</text>

<text x="45" y="238" class="l">② The live chat with a rep</text><text x="45" y="258" class="l">→ the CARD and the rep</text>
<text x="335" y="236" class="s">the model relays every message:</text><text x="335" y="256" class="m">get_messages / send_message</text><text x="335" y="276" class="s">it can reword, drop or stop</text><text x="335" y="292" class="s">polling (and costs tokens)</text>
<text x="680" y="236" class="s">chat runs inside the card;</text><text x="680" y="256" class="m">ui/update-model-context</text><text x="680" y="276" class="s">tells the model "a person has</text><text x="680" y="292" class="s">joined"</text>

<text x="45" y="336" class="l">③ Which session gets an</text><text x="45" y="356" class="l">offer → CODE (state)</text>
<text x="335" y="334" class="s">keyed on the transport session id</text><text x="335" y="354" class="m">(Mcp-Session-Id) or a minted id</text><text x="335" y="374" class="s">spec 2026-07-28: "Remove protocol-</text><text x="335" y="390" class="s">level sessions"</text>
<text x="680" y="334" class="s">key on the verified user + a</text><text x="680" y="354" class="s">server-made handle bound to them</text><text x="680" y="374" class="s">("MUST NOT treat possession of a</text><text x="680" y="390" class="s">handle as authentication")</text>

<text x="45" y="434" class="l">④ Telemetry → CODE,</text><text x="45" y="454" class="l">off the model's back</text>
<text x="335" y="432" class="s">a model-written context field on</text><text x="335" y="452" class="s">every tool; each call waits on</text><text x="335" y="472" class="s">Within (probe: 300 ms delay →</text><text x="335" y="488" class="s">303 ms even when unwrapped)</text>
<text x="680" y="432" class="s">OpenTelemetry trace fields in</text><text x="680" y="452" class="m">_meta (traceparent)</text><text x="680" y="472" class="s">sent in the background; intent</text><text x="680" y="488" class="s">only inside get_vendor_answer</text>

<text x="45" y="532" class="l">⑤ The vendor's own</text><text x="45" y="552" class="l">instructions → the VENDOR</text>
<text x="335" y="530" class="s">a paragraph with "Do not mention"</text><text x="335" y="550" class="s">etc. is deleted. Probe: "Do not</text><text x="335" y="570" class="s">mention competitors." vanished</text>
<text x="680" y="530" class="s">only ever append; keep Within's</text><text x="680" y="550" class="s">rules in its own tool</text><text x="680" y="570" class="s">descriptions</text>

<g filter="url(#wobble)"><rect x="30" y="608" width="940" height="76" rx="14" class="grn"/></g>
<text x="50" y="636" class="l g">Already right, keep it:</text>
<text x="50" y="660" class="s">saved answers, not the model's guess · fail-open (vendor result always returns, 5 s budget) · offer and chat ids as handles ·</text>
<text x="50" y="676" class="s">identity from verified auth claims · MCP Apps for the card. (The model routes; that part is fine.)</text>
</svg>
