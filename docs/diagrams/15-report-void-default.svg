<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Run `asked` through the same redaction as the goal note, widened to phone numbers, and cap its length.</tspan></text>
