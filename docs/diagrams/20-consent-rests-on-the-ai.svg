<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="An accept with only a session id was accepted; an offer never shown was still forwarded">
<title>An accept with only a session id was accepted; an offer never shown was still forwarded</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M41.9 121.0 Q182.2 119.8 321.2 120.3 Q320.5 179.3 321.4 240.1 Q181.8 238.7 39.3 241.5 Q38.3 181.8 41.9 121.0" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">An accept call</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">body: customerSessionId</tspan></text>
<text x="54" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">status: accepted</tspan></text>
<path d="M338.4 120.6 Q480.4 117.8 620.6 119.8 Q619.3 181.1 621.7 238.4 Q482.4 238.6 341.2 238.5 Q340.1 177.7 338.4 120.6" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="354" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="354" dy="0">confirm_assistance</tspan></text>
<text x="354" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="354" dy="0">listed to the AI: true</tspan></text>
<path d="M640.3 119.8 Q776.9 121.6 918.3 118.7 Q920.7 179.7 920.8 241.1 Q780.2 239.1 638.7 238.5 Q640.3 180.5 640.3 119.8" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="654" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="654" dy="0">An offer never shown</tspan></text>
<text x="654" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="654" dy="0">forwarded: true</tspan></text>
<text x="654" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="654" dy="0">/v1/offers/offer_never_shown_999/ac…</tspan></text>
<path d="M38.1 271.8 Q480.1 272.1 920.0 270.1 Q921.2 318.8 920.5 372.0 Q483.4 368.6 41.7 368.1 Q39.5 321.4 38.1 271.8" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="296" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="700"><tspan x="56" dy="0">Real Claude, 24 runs with an offer waiting: the accept tool was called 0 times.</tspan></text>
<text x="56" y="322" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328"><tspan x="56" dy="0">So in practice the model declined. The SDK itself does not stop it from accepting.</tspan></text>
<text x="56" y="348" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="56" dy="0">Checks E1 to E3, and real-Claude runs from 2026-11-21.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">Consent rests on the AI, not on the SDK</tspan></text>
<rect x="840" y="30" width="112.7" height="22" rx="11" fill="#f97316"/>
<text x="896.4" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-18 · Medium</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The SDK forwards an accept without checking that the customer chose it, so everything depends on what the model decides.</tspan></text>
<g filter="url(#wob)">
<path d="M40.5 445.2 Q478.7 446.0 920.9 446.3 Q919.0 487.9 918.4 533.3 Q479.4 535.1 38.6 533.9 Q37.8 489.7 40.5 445.2" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="54" dy="0">What Within should change</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Register the confirm tool as card-only (`visibility: [&quot;app&quot;]`), so the AI never sees it.</tspan></text>
</g>
</svg>