<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A tool whose output format allows only shipped or pending fails when Within is down, because the SDK writes service_unreachable">
<title>A tool whose output format allows only shipped or pending fails when Within is down, because the SDK writes service_unreachable</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M41.6 121.3 Q165.5 120.4 290.7 120.6 Q291.5 166.6 291.9 216.4 Q168.5 216.1 41.1 216.8 Q43.0 167.7 41.6 121.3" fill="#f3faf6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Within is up</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">the vendor's tool returns</tspan></text>
<text x="54" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">status: shipped or pending</tspan></text>
<path d="M292 168 Q342.4 167.3 400 168" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M389.4 173.6 L400 168 L389.5 162.1" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M405.7 119.6 Q529.2 120.4 652.3 119.3 Q653.0 166.4 654.2 214.2 Q528.5 216.6 405.3 216.6 Q406.7 167.1 405.7 119.6" fill="#f3faf6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="418" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="418" dy="0">Call result</tspan></text>
<text x="418" y="192" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="21" fill="#10b981" font-weight="700"><tspan x="418" dy="0">ok</tspan></text>
<path d="M39.4 249.5 Q164.8 250.9 288.2 250.4 Q289.6 307.2 290.0 359.9 Q167.2 360.5 41.8 358.3 Q40.1 304.8 39.4 249.5" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="54" y="274" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Within is down</tspan></text>
<text x="54" y="296" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">the SDK writes</tspan></text>
<text x="54" y="315" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">status: &quot;service_unreachable&quot;</tspan></text>
<text x="54" y="334" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">into the vendor's data</tspan></text>
<path d="M292 305 Q342.8 304.1 400 305" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M389.4 310.6 L400 305 L389.6 299.1" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M404.0 248.9 Q659.7 247.8 920.3 248.5 Q920.0 303.2 920.0 360.4 Q662.3 361.3 403.0 358.5 Q403.4 302.1 404.0 248.9" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="418" y="274" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="418" dy="0">The tool declares status as shipped or pending</tspan></text>
<text x="418" y="296" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="418" dy="0">Check A3b: the call fails with an output validation error</tspan></text>
<text x="418" y="315" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="418" dy="0">&quot;Output validation error: Invalid structured content for tool …&quot;</tspan></text>
<text x="40" y="392" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#59636e"><tspan x="40" dy="0">The extra line of text does arrive (check A2, 2 ms). The harm is in the vendor's structured data.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">An outage at Within changes the vendor's answer</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-02 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">If Within cannot be reached, the vendor's text still comes back, but the SDK also writes its own status into the data.</tspan></text>
<g filter="url(#wob)">
<path d="M41.4 447.8 Q258.6 447.2 471.0 446.9 Q470.3 490.6 469.0 534.6 Q255.3 535.8 38.2 534.7 Q38.4 491.4 41.4 447.8" fill="#f6f6f4" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Where in the code</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="54" dy="0">unreachableVendorResult, dist/index.js line 1343, called</tspan><tspan x="54" dy="15.84">from instrumentTool at line 1526.</tspan></text>
<path d="M490.5 445.1 Q702.7 446.1 918.4 444.9 Q918.0 489.1 921.9 532.5 Q705.8 531.7 488.6 532.1 Q490.9 489.5 490.5 445.1" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="504" dy="0">Add the note as text only, or in _meta, and never touch</tspan><tspan x="504" dy="15.84">structuredContent.</tspan></text>
</g>
</svg>