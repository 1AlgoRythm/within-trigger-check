<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="A 300-character goal worked: true. A 375-character goal was rejected: true">
<title>A 300-character goal worked: true. A 375-character goal was rejected: true</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M38.5 129.6 Q241.3 128.2 442.0 129.9 Q440.7 189.5 439.9 251.5 Q238.3 248.3 39.4 249.2 Q36.9 189.7 38.5 129.6" fill="#f3faf6" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="154" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">A 300-character goal</tspan></text>
<text x="54" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">the tool call goes through</tspan></text>
<text x="56" y="230" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="21" fill="#10b981" font-weight="700"><tspan x="56" dy="0">accepted</tspan></text>
<path d="M521.4 129.9 Q718.3 130.0 918.6 128.0 Q917.4 190.5 920.0 248.0 Q719.2 248.8 520.4 248.9 Q518.7 187.7 521.4 129.9" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="534" y="154" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="534" dy="0">A 375-character goal</tspan></text>
<text x="534" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="534" dy="0">the whole tool call is rejected</tspan></text>
<text x="536" y="230" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="21" fill="#ef4444" font-weight="700"><tspan x="536" dy="0">rejected</tspan></text>
<path d="M39.0 290.2 Q482.4 288.9 921.6 289.4 Q919.3 334.2 920.3 381.4 Q479.3 382.8 38.8 381.2 Q41.3 335.9 39.0 290.2" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="318" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328" font-weight="700"><tspan x="56" dy="0">The error the model gets:</tspan></text>
<text x="56" y="344" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#ef4444"><tspan x="56" dy="0">MCP error -32602: Input validation error: Invalid arguments for tool search: String must contain at most 300 …</tspan></text>
<text x="56" y="366" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="56" dy="0">The SDK already cuts the goal to 300 characters itself, so the limit on the input is not needed.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">A goal longer than 300 characters rejects the call</tspan></text>
<rect x="840" y="30" width="112.7" height="22" rx="11" fill="#f97316"/>
<text x="896.4" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-05 · Medium</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The SDK adds a context input limited to 300 characters. A longer text from the model fails the whole call.</tspan></text>
<g filter="url(#wob)">
<path d="M41.6 447.2 Q483.0 447.5 921.4 445.4 Q921.6 489.4 920.2 532.9 Q482.0 532.5 40.6 532.5 Q40.4 488.6 41.6 447.2" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="54" dy="0">What Within should change</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Remove `.max(300)` from the validator and keep the trim.</tspan></text>
</g>
</svg>