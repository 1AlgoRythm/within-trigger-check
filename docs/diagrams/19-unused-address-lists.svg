<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Lists defined: 2; lists used: 0">
<title>Lists defined: 2; lists used: 0</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M40.1 131.7 Q238.3 130.8 438.0 131.1 Q441.4 191.1 440.1 249.2 Q238.2 252.2 40.0 251.6 Q38.8 190.4 40.1 131.7" fill="#eef4fb" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="154" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Defined in the code</tspan></text>
<text x="54" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">2 lists of private-network addresses</tspan></text>
<text x="56" y="232" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="21" fill="#3b82f6" font-weight="700"><tspan x="56" dy="0">2 defined</tspan></text>
<path d="M520.2 128.2 Q718.0 128.2 918.2 130.0 Q917.9 188.6 919.8 249.4 Q722.3 252.1 521.3 251.5 Q522.4 192.1 520.2 128.2" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="534" y="154" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="534" dy="0">Checked against</tspan></text>
<text x="534" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="534" dy="0">the address of any request</tspan></text>
<text x="536" y="232" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="21" fill="#ef4444" font-weight="700"><tspan x="536" dy="0">0 used</tspan></text>
<text x="40" y="300" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#59636e"><tspan x="40" dy="0">Check F5. A list that is built and never read gives a reader the wrong idea about what is blocked.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">Two lists of private addresses are never used</tspan></text>
<rect x="840" y="30" width="90.4" height="22" rx="11" fill="#3b82f6"/>
<text x="885.2" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-17 · Low</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">The SDK builds lists of private-network addresses, as if to refuse them, and then never checks an address against them.</tspan></text>
<g filter="url(#wob)">
<path d="M40.6 447.5 Q478.5 447.5 919.9 445.6 Q920.7 490.5 919.6 532.8 Q477.9 534.2 38.6 533.6 Q42.0 491.4 40.6 447.5" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="54" dy="0">What Within should change</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Use the lists where an outside address is contacted, or delete them.</tspan></text>
</g>
</svg>