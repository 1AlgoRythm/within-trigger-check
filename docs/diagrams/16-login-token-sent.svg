<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="W-21, High: with the new identity option on, the SDK copies the customer's signed login token from the tool call into the activity report, as authToken, and sends it to Within on every call. Without the option the token is not sent. Within's docs say the raw bearer token stays on the vendor's server.">
<title>W-21: the login token leaves the vendor's server</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.flow{fill:none;stroke:var(--org);stroke-width:3;stroke-dasharray:8 7;animation:dash 1.2s linear infinite}
.flowr{fill:none;stroke:var(--red);stroke-width:3.4;stroke-dasharray:8 7;animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-30}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.25}}
.hot{fill:var(--red);animation:blink 1s steps(1) infinite}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.r{fill:var(--red)}.g{fill:var(--grn)}.b{fill:var(--blu)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">16 · W-21 (High): the login token goes to Within</text>
<text x="30" y="70" class="s">A login token is a credential: whoever holds it can act as that customer until it expires. New in 0.4.0, identity option on.</text>

<g filter="url(#wobble)">
  <rect x="30" y="100" width="210" height="130" rx="12" class="ink"/>
  <rect x="300" y="100" width="300" height="130" rx="12" class="blu"/>
  <rect x="680" y="100" width="290" height="130" rx="12" class="org"/>
  <path d="M240 165 L295 165" class="flow" marker-end="url(#ah)"/>
  <path d="M600 165 L675 165" class="flowr" marker-end="url(#ah)"/>
</g>
<text x="46" y="130" class="l">① customer's AI app</text>
<text x="46" y="156" class="s">calls a vendor tool,</text>
<text x="46" y="178" class="s">logged in with a</text>
<text x="46" y="200" class="m">Bearer eyJhbGci…</text>
<text x="316" y="130" class="l b">② the vendor's server + SDK</text>
<text x="316" y="156" class="m">identity: { provider, issuer }</text>
<text x="316" y="178" class="s">signedLoginToken(extra) copies</text>
<text x="316" y="200" class="s">authInfo.token into the report</text>
<text x="696" y="130" class="l o">③ Within's API</text>
<text x="696" y="156" class="m">POST /v1/activity</text>
<text x="696" y="178" class="m hot">authToken: "eyJhbGci…"</text>
<text x="696" y="204" class="s">arrived exactly as received</text>

<text x="30" y="272" class="l">Same call, with and without the option (check N1, stand-in server on 127.0.0.1):</text>
<g filter="url(#wobble)">
  <rect x="30" y="288" width="450" height="130" rx="12" class="grn"/>
  <rect x="520" y="288" width="450" height="130" rx="12" class="red"/>
</g>
<text x="46" y="318" class="l g">default (no identity option)</text>
<text x="46" y="344" class="m">source, sdkVersion, customerSessionId,</text>
<text x="46" y="362" class="m">customerUserId, authUserId, authIssuer,</text>
<text x="46" y="380" class="m">toolName, outcome, durationMs</text>
<text x="46" y="406" class="s">authToken: not sent ✓</text>
<text x="536" y="318" class="l r">identity option on</text>
<text x="536" y="344" class="m">… the same fields, plus</text>
<text x="536" y="366" class="m hot">displayName, authToken</text>
<text x="536" y="392" class="s">the token is in the report ✗</text>
<text x="536" y="410" class="s">(N1 verdict: fail)</text>

<g filter="url(#wobble)"><rect x="30" y="440" width="940" height="74" rx="14" class="red"/></g>
<text x="50" y="470" class="l r">Within's docs, "Left on your server": "…and the raw bearer token."</text>
<text x="50" y="496" class="s">The docs page still describes 0.3.0, so it may just be behind the code. What Within's server does with the token, we cannot see.</text>

<g filter="url(#wobble)"><rect x="30" y="532" width="940" height="72" rx="14" class="grn"/></g>
<text x="50" y="560" class="l g">Fix: don't send it. The report already carries the verified user id and authIssuer.</text>
<text x="50" y="586" class="s">If Within must verify the token itself, make that a separate, named option and list it in the docs table.</text>
</svg>
