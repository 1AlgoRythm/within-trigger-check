<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680" role="img" aria-label="One test run, step by step: the runner starts claude -p with Compare Ledgerly and Paywise; Claude lists five tools, calls get_company twice, then get_vendor_answer with topic competitive; the SDK reports each call to the relay tagged with the run id; the runner reads tool_use blocks and marks a false alarm.">
<title>One test run, step by step (run 1, Claude Haiku 5.5)</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter>
<marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#222" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.lane{fill:none;stroke:#bbb;stroke-width:2;stroke-dasharray:4 6}
.org{fill:none;stroke:var(--org);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.blu{fill:none;stroke:var(--blu);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.step{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;animation:lit 9s linear infinite}
@keyframes lit{0%,100%{stroke:#222;stroke-width:2.4}}
.s1{animation-name:a1}.s2{animation-name:a2}.s3{animation-name:a3}.s4{animation-name:a4}.s5{animation-name:a5}.s6{animation-name:a6}.s7{animation-name:a7}
@keyframes a1{0%,12%{stroke:#f97316;stroke-width:4}13%,100%{stroke:#222;stroke-width:2.4}}
@keyframes a2{0%,13%{stroke:#222}14%,26%{stroke:#f97316;stroke-width:4}27%,100%{stroke:#222;stroke-width:2.4}}
@keyframes a3{0%,27%{stroke:#222}28%,40%{stroke:#f97316;stroke-width:4}41%,100%{stroke:#222;stroke-width:2.4}}
@keyframes a4{0%,41%{stroke:#222}42%,54%{stroke:#f97316;stroke-width:4}55%,100%{stroke:#222;stroke-width:2.4}}
@keyframes a5{0%,55%{stroke:#222}56%,68%{stroke:#ef4444;stroke-width:4}69%,100%{stroke:#222;stroke-width:2.4}}
@keyframes a6{0%,69%{stroke:#222}70%,82%{stroke:#f97316;stroke-width:4}83%,100%{stroke:#222;stroke-width:2.4}}
@keyframes a7{0%,83%{stroke:#222}84%,98%{stroke:#ef4444;stroke-width:4}99%,100%{stroke:#222;stroke-width:2.4}}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14px}.m{font-family:Menlo,monospace;font-size:12.5px}
.o{fill:var(--org)}.b{fill:var(--blu)}.r{fill:var(--red)}.n{font-size:15px;font-weight:bold;fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="680" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">4 · One test run, step by step</text>
<text x="30" y="70" class="s">The real trace of the false alarm in run 1 (Claude Haiku 5.5). Each arrow lights up in order.</text>

<g filter="url(#wobble)">
  <rect x="45" y="90" width="150" height="44" rx="10" class="org"/>
  <rect x="275" y="90" width="150" height="44" rx="10" class="ink"/>
  <rect x="505" y="90" width="190" height="44" rx="10" class="blu"/>
  <rect x="785" y="90" width="170" height="44" rx="10" class="org"/>
</g>
<text x="62" y="118" class="l o">runner.mjs</text>
<text x="300" y="118" class="l">Claude (Haiku)</text>
<text x="518" y="118" class="l b">Acme + Within SDK</text>
<text x="798" y="118" class="l o">relay (fake Within)</text>
<path d="M120 134 V520" class="lane"/><path d="M350 134 V520" class="lane"/><path d="M600 134 V520" class="lane"/><path d="M870 134 V520" class="lane"/>

<g filter="url(#wobble)">
<path d="M120 165 H345" class="step s1" marker-end="url(#ah)"/>
<path d="M350 222 H595" class="step s2" marker-end="url(#ah)"/>
<path d="M350 285 H595" class="step s3" marker-end="url(#ah)"/>
<path d="M600 318 H865" class="step s4" marker-end="url(#ah)"/>
<path d="M350 385 H595" class="step s5" marker-end="url(#ah)"/>
<path d="M600 418 H865" class="step s6" marker-end="url(#ah)"/>
<path d="M350 475 H125" class="step s7" marker-end="url(#ah)"/>
</g>
<text x="130" y="151" class="n">1</text><text x="146" y="151" class="m">claude -p "Compare Ledgerly and Paywise."</text>
<text x="360" y="208" class="n">2</text><text x="376" y="208" class="s">starts the server (stdio), sees 5 tools</text>
<text x="376" y="240" class="m">2 Acme + 3 Within</text>
<text x="360" y="271" class="n">3</text><text x="376" y="271" class="m">get_company ×2 (Ledgerly, Paywise)</text>
<text x="376" y="303" class="s">+ context: "User wants to compare…"</text>
<text x="610" y="304" class="n">4</text><text x="626" y="304" class="m">POST /r/&lt;runId&gt;/v1/activity</text>
<text x="626" y="340" class="s">mcpIntent = the context text,</text>
<text x="626" y="358" class="s">then /v1/offers/deliver</text>
<text x="360" y="371" class="n r">5</text><text x="376" y="371" class="m r">get_vendor_answer</text>
<text x="376" y="403" class="m">{topic:"competitive"}</text>
<text x="610" y="404" class="n">6</text><text x="626" y="404" class="m">POST /r/&lt;runId&gt;/v1/answers</text>
<text x="626" y="440" class="s">canned reply, match: "low"</text>
<text x="140" y="461" class="n">7</text><text x="156" y="461" class="s">stream-json output: every</text>
<text x="156" y="495" class="m">tool_use</text><text x="230" y="495" class="s">block it made</text>

<g filter="url(#wobble)"><rect x="40" y="540" width="560" height="110" rx="14" class="red"/>
<rect x="630" y="540" width="330" height="110" rx="14" class="ink"/></g>
<text x="60" y="570" class="l">8 · verdict</text>
<text x="60" y="596" class="s">expected: no call (it's Acme's own data)</text>
<text x="60" y="618" class="s">got: get_vendor_answer → <tspan class="r" font-weight="bold">✗ false alarm</tspan></text>
<text x="60" y="640" class="s">Claude then offered the user "a chat with a live person"</text>
<text x="648" y="570" class="l">why /r/&lt;runId&gt;/ ?</text>
<text x="648" y="596" class="s">the SDK's address carries the</text>
<text x="648" y="616" class="s">question's id, so every record</text>
<text x="648" y="636" class="s">is tied to the question behind it</text>
</svg>
