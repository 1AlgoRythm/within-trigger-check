<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="Recall and precision as a smoke alarm, with run 1 numbers: 10 true positives, 0 misses, 1 false alarm, 9 true negatives. Recall 10 of 10 is 100 percent, precision 10 of 11 is 91 percent.">
<title>Recall and precision, as a smoke alarm (run 1 numbers)</title>
<defs><filter id="wobble" x="-10%" y="-10%" width="120%" height="120%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
<style>
:root{--ink:#222;--org:#f97316;--blu:#3b82f6;--grn:#10b981;--red:#ef4444}
.ink{fill:none;stroke:var(--ink);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.grn{fill:none;stroke:var(--grn);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.red{fill:none;stroke:var(--red);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.org{fill:none;stroke:var(--org);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.flame{fill:var(--org);opacity:.85;transform-origin:130px 250px;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.08,0.92)}}
@keyframes ring{0%{r:12;opacity:.9}100%{r:40;opacity:0}}
.wave{fill:none;stroke:var(--red);stroke-width:2;animation:ring 1.2s ease-out infinite}
.wave2{animation-delay:.6s}
text{fill:var(--ink);font-family:'Bradley Hand','Segoe Print','Comic Sans MS',cursive}
.h{font-size:26px;font-weight:bold}.l{font-size:17px}.s{font-size:14.5px}.big{font-size:34px;font-weight:bold}
.g{fill:var(--grn)}.r{fill:var(--red)}.o{fill:var(--org)}
</style>
<rect x="0" y="0" width="1000" height="620" rx="18" fill="#fffdf7"/>
<text x="30" y="44" class="h">5 · The two scores, as a smoke alarm</text>
<text x="30" y="70" class="s">A buying question is a "fire". Calling get_vendor_answer is the alarm "ringing". Numbers from run 1.</text>

<g filter="url(#wobble)">
  <path d="M60 300 L60 200 L130 140 L200 200 L200 300 Z" class="ink"/>
  <path d="M110 300 v-45 h40 v45" class="ink"/>
  <path d="M130 250 q-22 -25 0 -55 q5 22 18 26 q8 -14 4 -30 q22 26 0 59 z" class="flame"/>
  <circle cx="230" cy="150" r="14" class="ink"/>
</g>
<circle cx="230" cy="150" r="12" class="wave"/><circle cx="230" cy="150" r="12" class="wave wave2"/>
<text x="252" y="142" class="s">ringing =</text><text x="252" y="161" class="s">"called Within"</text>
<text x="60" y="330" class="s">fire = a buying question</text>

<g filter="url(#wobble)">
  <rect x="420" y="130" width="260" height="110" rx="10" class="grn"/>
  <rect x="690" y="130" width="260" height="110" rx="10" class="red"/>
  <rect x="420" y="250" width="260" height="110" rx="10" class="red"/>
  <rect x="690" y="250" width="260" height="110" rx="10" class="grn"/>
</g>
<text x="470" y="118" class="s">called Within</text><text x="740" y="118" class="s">didn't call</text>
<text x="300" y="190" class="s">buying (10)</text><text x="300" y="310" class="s">normal (10)</text>
<text x="436" y="172" class="big g">10</text><text x="480" y="168" class="l">true positive</text><text x="436" y="210" class="s">fire, alarm rang ✓</text>
<text x="706" y="172" class="big r">0</text><text x="740" y="168" class="l">false negative</text><text x="706" y="210" class="s">fire, silent (a lost lead)</text>
<text x="436" y="292" class="big r">1</text><text x="470" y="288" class="l">false positive</text><text x="436" y="322" class="s">no fire, rang: "Compare</text><text x="436" y="342" class="s">Ledgerly and Paywise"</text>
<text x="706" y="292" class="big g">9</text><text x="740" y="288" class="l">true negative</text><text x="706" y="330" class="s">no fire, silent ✓</text>

<g filter="url(#wobble)">
  <rect x="30" y="395" width="460" height="130" rx="14" class="grn"/>
  <rect x="510" y="395" width="460" height="130" rx="14" class="org"/>
</g>
<text x="50" y="425" class="l">Recall: of the fires, how many rang?</text>
<text x="50" y="455" class="s">caught ÷ (caught + missed) = 10 ÷ (10 + 0)</text>
<text x="50" y="500" class="big g">100%</text><text x="160" y="497" class="s">no lost leads</text>
<text x="530" y="425" class="l">Precision: of the rings, how many were fires?</text>
<text x="530" y="455" class="s">real rings ÷ all rings = 10 ÷ (10 + 1)</text>
<text x="530" y="500" class="big o">91%</text><text x="620" y="497" class="s">one needless call to Within</text>

<text x="30" y="565" class="l">Why recall alone isn't enough:</text>
<text x="30" y="590" class="s">an alarm that rings all day catches every fire (100% recall), but nobody trusts it. You need both numbers.</text>
</svg>
