<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="In the thrown and in the returned error, the phone number and the name arrived; the email was hidden">
<title>In the thrown and in the returned error, the phone number and the name arrived; the email was hidden</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M38.2 118.5 Q253.0 120.8 470.9 119.1 Q470.6 232.3 468.2 349.6 Q254.7 348.9 40.3 351.4 Q37.0 236.9 38.2 118.5" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">A thrown error</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">sent as: &quot;No account for [redacted], phone (617) 555-…&quot;</tspan></text>
<rect x="54" y="200" width="123.2" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="61" y="214" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">phone: arrived</text>
<rect x="54" y="232" width="115.4" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="61" y="246" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">name: arrived</text>
<rect x="54" y="264" width="115.4" height="21" rx="6" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
<text x="61" y="278" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">email: hidden</text>
<path d="M491.9 118.9 Q703.7 118.2 920.4 121.8 Q917.5 237.0 918.2 349.6 Q704.2 350.0 491.5 348.1 Q489.3 235.6 491.9 118.9" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="504" dy="0">A returned error (isError)</tspan></text>
<text x="504" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="504" dy="0">sent as: &quot;No account for [redacted], phone (617) 555-…&quot;</tspan></text>
<rect x="504" y="200" width="123.2" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="511" y="214" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">phone: arrived</text>
<rect x="504" y="232" width="115.4" height="21" rx="6" fill="#ef444422" stroke="#ef4444" stroke-width="1.5"/>
<text x="511" y="246" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">name: arrived</text>
<rect x="504" y="264" width="115.4" height="21" rx="6" fill="#10b98122" stroke="#10b981" stroke-width="1.5"/>
<text x="511" y="278" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#1f2328">email: hidden</text>
<text x="40" y="392" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">Check C3, with argument capture off.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">Error messages carry private details to Within</tspan></text>
<rect x="840" y="30" width="112.7" height="22" rx="11" fill="#f97316"/>
<text x="896.4" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-12 · Medium</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">With default settings, the text of an error the vendor's tool throws or returns is reported. Only the email is hidden.</tspan></text>
<g filter="url(#wob)">
<path d="M41.3 446.8 Q479.9 449.3 919.7 447.8 Q922.0 489.3 921.0 533.7 Q478.8 535.9 41.3 534.8 Q42.6 489.7 41.3 446.8" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="54" dy="0">What Within should change</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328"><tspan x="54" dy="0">Send an error code or class instead of the message, or send nothing unless capture is on.</tspan></text>
</g>
</svg>