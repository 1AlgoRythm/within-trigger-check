<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="The vendor tool's own context value never reaches its handler and goes to Within as the goal text">
<title>The vendor tool's own context value never reaches its handler and goes to Within as the goal text</title><defs><filter id="wob" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter><style>
.flow{stroke-dasharray:9 7;animation:dash 1.1s linear infinite}
.slow{stroke-dasharray:9 7;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.7s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.6}}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(.02)}to{transform:scaleY(1)}}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.6s cubic-bezier(.2,.8,.2,1) both}
@keyframes growx{from{transform:scaleX(.02)}to{transform:scaleX(1)}}
.bob{animation:bob 2.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.blink{animation:blink 1.4s steps(2,start) infinite}
@keyframes blink{50%{opacity:.15}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs>
<rect width="960" height="540" fill="#fffdf7"/>
<g filter="url(#wob)">
<path d="M41.4 120.0 Q172.6 121.6 308.2 120.9 Q309.8 172.2 309.4 221.0 Q175.6 219.6 39.8 222.0 Q39.9 173.1 41.4 120.0" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="144" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">The model's call</tspan></text>
<text x="54" y="166" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">question: How do refunds work?</tspan></text>
<text x="54" y="185" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">context: Customer Priya Raman, …</tspan></text>
<path d="M312 170 Q364.5 167.5 420 170" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M409.2 175.3 L420 170 L409.7 163.8" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M423.0 101.2 Q549.2 99.8 674.0 100.2 Q673.6 168.2 674.0 239.6 Q548.3 240.9 422.9 240.3 Q422.1 172.9 423.0 101.2" fill="#fff7ed" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="pulse"/>
<text x="438" y="124" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="438" dy="0">The SDK</tspan></text>
<text x="438" y="146" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="438" dy="0">takes context away</tspan></text>
<text x="438" y="165" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="438" dy="0">from the vendor's input</tspan></text>
<path d="M676 140 Q724.8 133.9 770 120" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M761.6 128.6 L770 120 L758.2 117.6" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M676 200 Q721.1 217.2 770 232" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M758.3 234.5 L770 232 L761.6 223.4" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M774.6 90.4 Q845.9 91.6 918.1 88.9 Q920.3 122.9 921.3 160.5 Q847.4 160.7 772.3 159.8 Q772.8 123.0 774.6 90.4" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="114" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328" font-weight="700"><tspan x="788" dy="0">Vendor's code</tspan></text>
<text x="788" y="136" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="788" dy="0">gets question</tspan></text>
<path d="M773.0 199.2 Q846.1 201.1 921.7 199.8 Q920.5 232.8 921.5 268.2 Q848.6 270.6 772.4 270.8 Q775.2 236.2 773.0 199.2" fill="#fff1f0" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="788" y="224" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328" font-weight="700"><tspan x="788" dy="0">Within</tspan></text>
<text x="788" y="246" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="788" dy="0">gets it as goal</tspan></text>
<path d="M38.1 301.5 Q479.2 298.1 919.4 298.9 Q921.8 336.9 920.2 370.5 Q483.5 370.8 42.0 371.1 Q40.9 337.0 38.1 301.5" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="326" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#1f2328"><tspan x="56" dy="0">The vendor's handler received: {&quot;question&quot;:&quot;How do refunds work?&quot;}</tspan></text>
<text x="56" y="350" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#ef4444"><tspan x="56" dy="0">Within received: &quot;Customer Priya Raman, plan Team, 40 seats&quot;</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">A vendor tool's own context input is swallowed</tspan></text>
<rect x="840" y="30" width="97.8" height="22" rx="11" fill="#ef4444"/>
<text x="888.9" y="45.32" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="700" fill="#fff">W-04 · High</text>
<text x="40" y="80" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#59636e"><tspan x="40" dy="0">If a vendor tool has its own input called context, the SDK takes it. The vendor's code never sees the value.</tspan></text>
<g filter="url(#wob)">
<path d="M40.1 446.7 Q253.8 444.1 470.7 444.9 Q473.0 488.8 471.5 533.9 Q253.3 532.1 39.4 533.2 Q37.7 492.4 40.1 446.7" fill="#f6f6f4" stroke="#1f2328" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="54" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#1f2328" font-weight="700"><tspan x="54" dy="0">Where in the code</tspan></text>
<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="54" dy="0">splitMcpContext, dist/index.js line 1398, applied inside</tspan><tspan x="54" dy="15.84">patchRegisterTool (line 1415) to every tool.</tspan></text>
<path d="M489.0 446.9 Q702.9 445.3 919.8 445.3 Q919.5 489.7 919.1 534.9 Q704.2 537.3 488.3 535.5 Q489.3 489.3 489.0 446.9" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="504" dy="0">Use a name no vendor would use, such as _within_goal, or</tspan><tspan x="504" dy="15.84">carry the goal in _meta.</tspan></text>
</g>
</svg>