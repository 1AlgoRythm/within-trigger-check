<text x="54" y="195" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="54" dy="0">_meta: the vendor's own data</tspan></text>
<path d="M422 185 Q468.2 188.8 520 185" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" class="flow"/>
<path d="M509.9 191.5 L520 185 L509.1 180.0" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
