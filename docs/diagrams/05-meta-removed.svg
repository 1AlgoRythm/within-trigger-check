<text x="538" y="154" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14.5" fill="#1f2328" font-weight="700"><tspan x="538" dy="0">With a rep's offer attached</tspan></text>
<text x="538" y="176" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="538" dy="0">content: the answer + one line for the offer</tspan></text>
<text x="538" y="195" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="538" dy="0">_meta: gone (undefined)</tspan></text>
<path d="M40.1 291.1 Q483.1 289.0 921.1 288.5 Q920.6 323.5 919.4 361.0 Q477.0 363.1 38.6 361.4 Q39.7 324.3 40.1 291.1" fill="#fff" stroke="#1f2328" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="56" y="318" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#1f2328"><tspan x="56" dy="0">Check B2 (fail): &quot;_meta after the offer was attached: undefined. The offer itself arrived: true&quot;</tspan></text>
<text x="56" y="346" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#59636e"><tspan x="56" dy="0">We do not know why Within removes _meta. It may be to stop a second card from appearing.</tspan></text>
</g>
<text x="40" y="52" font-family="'Bradley Hand','Segoe Print','Marker Felt','Comic Sans MS',cursive" font-size="27" fill="#1f2328" font-weight="700"><tspan x="40" dy="0">The vendor's own _meta data is removed</tspan></text>
