<text x="54" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="54" dy="0">attachInvitation, dist/index.js lines 1323 to 1335: delete</tspan><tspan x="54" dy="15.84">next._meta.</tspan></text>
<path d="M489.9 447.5 Q705.3 444.2 918.7 444.9 Q918.8 487.7 921.7 532.5 Q705.2 532.3 489.0 534.0 Q487.1 491.4 489.9 447.5" fill="#f3f7fd" stroke="#3b82f6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="504" y="465" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12.5" fill="#3b82f6" font-weight="700"><tspan x="504" dy="0">What Within should change</tspan></text>
<text x="504" y="482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#1f2328"><tspan x="504" dy="0">Remove only the keys that mount the card, or explain in the</tspan><tspan x="504" dy="15.84">docs why all of them go.</tspan></text>
</g>
